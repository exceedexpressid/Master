<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Admin - Exceed Express</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#151928">
    <link rel="apple-touch-icon" href="Logo.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-dark': '#0b1120',
                        'app-card': '#1e2533',
                        'app-header': '#151928',
                        'app-border': '#2a3042'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>

    <style>
        body { 
            touch-action: manipulation; 
            background-color: #0b1120; 
            font-family: 'Inter', system-ui, sans-serif; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        /* Custom Scrollbar for Web */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2a3042; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #374151; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        .progress-bar-striped {
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
            background-size: 1rem 1rem;
        }

        /* Number Input Reset */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* Select Dropdown Reset */
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        /* Override Calendar Picker Icon in Webkit */
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }
    </style>
</head>
<body class="antialiased text-slate-200 selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useMemo, Component } = React;

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Dashboard Crash:", error, errorInfo);
                this.setState({ errorInfo: error.toString() });
            }
            handleReset = () => {
                localStorage.clear();
                window.location.reload();
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-app-dark flex flex-col items-center justify-center p-6 text-center">
                            <i className="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
                            <h1 className="text-2xl font-black text-white mb-2">Terjadi Kesalahan Sistem</h1>
                            <p className="text-slate-400 text-sm mb-6 max-w-md">Data di memori browser Anda mengalami kerusakan (corrupt). Silakan klik tombol di bawah untuk membersihkan memori dan memuat ulang aplikasi secara normal.</p>
                            <button onClick={this.handleReset} className="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all flex items-center">
                                <i className="fas fa-sync-alt mr-2"></i> Bersihkan Memori & Muat Ulang
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const loadLocal = (key, fallback) => {
            try { 
                const item = localStorage.getItem(key); 
                return item ? JSON.parse(item) : fallback; 
            } catch (e) { 
                console.error(`Error loading ${key} from local storage`, e);
                return fallback; 
            }
        };

        const formatCurrency = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return 'Rp 0';
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };

        function DashboardApp() {
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVHojspm17WSZU42RaMtgiNWJikRfGyTlPh1FczlDJS9JL52PxX0d9RpkNJYM4g424/exec"; 
            const APPSHEET_APP_ID = "APLIKASEXCEED-327461285";

            const [layoutMode, setLayoutMode] = useState(() => loadLocal('exceed_layout_mode', 'web'));
            const [isMasterLoggedIn, setIsMasterLoggedIn] = useState(() => loadLocal('exceed_master_logged_in', false));
            const [isLoadingSync, setIsLoadingSync] = useState(false);
            const [syncMessage, setSyncMessage] = useState({ text: '', type: '' });
            
            const [loginUname, setLoginUname] = useState('');
            const [loginPass, setLoginPass] = useState('');

            const [packages, setPackages] = useState(() => loadLocal('exceed_master_packages', []));
            const [masterOlshops, setMasterOlshops] = useState([]);
            const [masterZonas, setMasterZonas] = useState([]);
            const [masterKurirs, setMasterKurirs] = useState([]);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [globalStatusFilter, setGlobalStatusFilter] = useState('semua');
            
            const [activeTab, setActiveTab] = useState('olshop'); 
            
            const [expandedOlshops, setExpandedOlshops] = useState([]); 
            const [olshopFilters, setOlshopFilters] = useState({}); 
            const [expandedKurirs, setExpandedKurirs] = useState([]); 
            const [kurirFilters, setKurirFilters] = useState({}); 

            const [selectedImage, setSelectedImage] = useState(null);
            
            const [isCairkanModalOpen, setIsCairkanModalOpen] = useState(false);
            const [selectedOlshopToCairkan, setSelectedOlshopToCairkan] = useState(null);
            const [isProcessingCair, setIsProcessingCair] = useState(false);

            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [isProcessingEdit, setIsProcessingEdit] = useState(false);
            const [editModal, setEditModal] = useState({
                packageId: '', olshopName: '', status: '', metodeBayar: '', 
                hargaPaket: 0, ongkirKode: '', ongkirDasar: 0, tambahanOngkir: 0, 
                kurirId: '', tanggal: ''
            });

            const [opsCosts, setOpsCosts] = useState(() => loadLocal('exceed_ops_costs', { sewaKos: 0, biayaListrik: 0, biayaWifi: 0, akomodasi: 0, gajiAdmin: 0, lainLain: 0 }));
            const [workDays, setWorkDays] = useState(() => loadLocal('exceed_work_days', 26));
            const [kurirSettings, setKurirSettings] = useState(() => loadLocal('exceed_kurir_settings', {}));

            useEffect(() => { localStorage.setItem('exceed_layout_mode', JSON.stringify(layoutMode)); }, [layoutMode]);
            useEffect(() => { localStorage.setItem('exceed_master_logged_in', JSON.stringify(isMasterLoggedIn)); }, [isMasterLoggedIn]);
            useEffect(() => { localStorage.setItem('exceed_master_packages', JSON.stringify(packages)); }, [packages]);
            useEffect(() => { localStorage.setItem('exceed_ops_costs', JSON.stringify(opsCosts)); }, [opsCosts]);
            useEffect(() => { localStorage.setItem('exceed_work_days', JSON.stringify(workDays)); }, [workDays]);
            useEffect(() => { localStorage.setItem('exceed_kurir_settings', JSON.stringify(kurirSettings)); }, [kurirSettings]);

            const handleOpsChange = (field, value) => {
                const numValue = value === '' ? '' : Number(value);
                setOpsCosts(prev => ({ ...prev, [field]: numValue }));
            };

            const updateKurirSetting = (kurirName, field, value) => {
                setKurirSettings(prev => ({
                    ...prev,
                    [kurirName]: {
                        ...(prev[kurirName] || { gajiHarian: 150000, tglMasuk: '', tglAkhir: '', hariLibur: 0 }),
                        [field]: value
                    }
                }));
            };

            const toggleOlshop = (name) => setExpandedOlshops(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const toggleKurir = (name) => setExpandedKurirs(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const openCairkanModal = (olshop) => { setSelectedOlshopToCairkan(olshop); setIsCairkanModalOpen(true); };

            const getFinancials = (pkg) => {
                if(!pkg) return { hBarang:0, tagihan:0, oDasar:0, oTambahan:0, oTotal:0 };
                const hBarang = Number(pkg.hargaPaket) || 0;
                const tagihan = Number(pkg.totalTagihan) || 0;
                const selisihTagihan = tagihan - hBarang > 0 ? tagihan - hBarang : 0;
                
                let oTambahan = Number(pkg.tambahanOngkir) || 0;
                let oDasar = Number(pkg.ongkirDasar) || 0;
                
                if (oTambahan === 0 && oDasar > 0 && selisihTagihan > oDasar) oTambahan = selisihTagihan - oDasar;
                else if (oTambahan === 0 && oDasar === 0 && selisihTagihan > 0) oDasar = selisihTagihan;
                if (oDasar === 0 && oTambahan > 0 && selisihTagihan > oTambahan) oDasar = selisihTagihan - oTambahan;

                return { hBarang, tagihan, oDasar, oTambahan, oTotal: oDasar + oTambahan };
            };

            const getFotoUrl = (pkg) => {
                if(!pkg) return null;
                const fileKey = pkg.fotoBukti || pkg.foto_bukti || pkg.foto || pkg.bukti || pkg.gambar;
                if (!fileKey || String(fileKey).trim() === '') return null;
                if (String(fileKey).startsWith('http://') || String(fileKey).startsWith('https://')) return fileKey;
                return `https://www.appsheet.com/template/gettablefileurl?appName=${APPSHEET_APP_ID}&tableName=InputPaket&fileName=${encodeURIComponent(fileKey)}`;
            };

            const syncData = async (isLoginAttempt = false) => {
                setIsLoadingSync(true);
                if(!isLoginAttempt) setSyncMessage({ text: '', type: '' });
                
                try {
                    const response = await fetch(`${SCRIPT_URL}?action=getInitData&t=${new Date().getTime()}`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        setPackages(result.data.packages || []);
                        setMasterOlshops(result.data.olshop || []);
                        setMasterZonas(result.data.zona || []);
                        setMasterKurirs(result.data.kurir || []);

                        if(!isLoginAttempt) {
                            setSyncMessage({ text: 'Data berhasil diperbarui!', type: 'success' });
                            setTimeout(() => setSyncMessage({ text: '', type: '' }), 3000);
                        }
                        return true;
                    } else {
                        setSyncMessage({ text: 'Gagal memuat data dari server.', type: 'error' });
                        return false;
                    }
                } catch (error) {
                    setSyncMessage({ text: 'Koneksi terputus. Cek internet Anda.', type: 'error' });
                    return false;
                } finally {
                    setIsLoadingSync(false);
                }
            };

            useEffect(() => {
                if (isMasterLoggedIn) { syncData(); }
            }, [isMasterLoggedIn]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setSyncMessage({ text: 'Memeriksa kredensial...', type: 'info' });
                const validUser1 = loginUname === 'ellyasma991' && loginPass === '082213663662';
                const validUser2 = loginUname === 'idypandu' && loginPass === '082257849332';
                if (validUser1 || validUser2) {
                    setIsMasterLoggedIn(true);
                    setLoginUname(''); setLoginPass('');
                    syncData(true);
                } else {
                    setSyncMessage({ text: 'Username atau Password Salah.', type: 'error' });
                }
            };

            const handleLogout = () => { setIsMasterLoggedIn(false); setPackages([]); };

            const handleProsesCairkan = async () => {
                if (!selectedOlshopToCairkan || selectedOlshopToCairkan.paketBelumCairIds.length === 0) return;
                setIsProcessingCair(true);
                setSyncMessage({ text: `Memproses pencairan ${selectedOlshopToCairkan.name}...`, type: 'info' });
                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'cairkanPaket');
                    formData.append('packageIds', JSON.stringify(selectedOlshopToCairkan.paketBelumCairIds));
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setSyncMessage({ text: `Berhasil mencairkan ${result.updated} paket untuk ${selectedOlshopToCairkan.name}!`, type: 'success' });
                        setIsCairkanModalOpen(false);
                        syncData(); 
                    } else setSyncMessage({ text: 'Gagal memproses: ' + result.message, type: 'error' });
                } catch (error) { setSyncMessage({ text: 'Terjadi kesalahan jaringan.', type: 'error' }); } 
                finally { setIsProcessingCair(false); }
            };

            const openEditModal = (pkg) => {
                if(!pkg) return;
                let tgl = pkg.dateString || pkg.tanggalInput || '';
                if (tgl && tgl.includes('T')) tgl = tgl.split('T')[0];
                else if (tgl) {
                    try { const d = new Date(tgl); if (!isNaN(d.getTime())) tgl = d.toISOString().split('T')[0]; } 
                    catch(e) {}
                }

                setEditModal({
                    isOpen: true,
                    packageId: pkg.packageId || '',
                    olshopName: pkg.olshopName || '',
                    status: String(pkg.status || '').toUpperCase(),
                    metodeBayar: pkg.metodeBayar || '',
                    hargaPaket: pkg.hargaPaket || 0,
                    ongkirKode: pkg.ongkirKode || '',
                    ongkirDasar: pkg.ongkirDasar || 0,
                    tambahanOngkir: pkg.tambahanOngkir || 0,
                    kurirId: pkg.kurirEmailAsli || pkg.kurirId || '',
                    tanggal: tgl
                });
                setIsEditModalOpen(true);
            };

            const handleOngkirKodeChange = (val) => {
                const zona = masterZonas.find(z => z.id === val || z.nama === val);
                const harga = zona ? zona.harga : 0;
                setEditModal(prev => ({ ...prev, ongkirKode: val, ongkirDasar: harga }));
            };

            const handleEditSubmit = async (e) => {
                e.preventDefault();
                setIsProcessingEdit(true);
                setSyncMessage({ text: `Menyimpan perubahan resi ${editModal.packageId}...`, type: 'info' });

                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'editPackageMaster'); 
                    formData.append('packageId', editModal.packageId);
                    formData.append('olshopName', editModal.olshopName);
                    formData.append('status', editModal.status);
                    formData.append('metodeBayar', editModal.metodeBayar); 
                    formData.append('hargaPaket', editModal.hargaPaket);
                    formData.append('ongkirKode', editModal.ongkirKode); 
                    formData.append('tambahanOngkir', editModal.tambahanOngkir);
                    formData.append('kurirId', editModal.kurirId); 
                    formData.append('tanggal', editModal.tanggal);

                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();

                    if (result.status === 'success') {
                        setSyncMessage({ text: 'Perubahan berhasil disimpan!', type: 'success' });
                        setIsEditModalOpen(false);
                        syncData(); 
                    } else setSyncMessage({ text: 'Gagal mengedit: ' + result.message, type: 'error' });
                } catch (error) { setSyncMessage({ text: 'Terjadi kesalahan jaringan.', type: 'error' }); } 
                finally { setIsProcessingEdit(false); }
            };

            const { filteredPkgs, olshopReport, kurirReport, globalSummary } = useMemo(() => {
                let pkgs = packages || [];
                
                // 1. Filter Search (Text)
                if (searchQuery) {
                    const q = searchQuery.toLowerCase().trim();
                    pkgs = pkgs.filter(p => String(p.customerName || '').toLowerCase().includes(q) || String(p.packageId || '').toLowerCase().includes(q) || String(p.olshopName || '').toLowerCase().includes(q) || String(p.kurirId || '').toLowerCase().includes(q));
                }
                
                // 2. Filter Tanggal (Date)
                if (startDate || endDate) {
                   pkgs = pkgs.filter(p => {
                      let pDateStr = p.dateString || p.tanggal || '';
                      if (!pDateStr) return false;
                      let normalizedDateStr = "";
                      try {
                          let d = new Date(pDateStr);
                          if (isNaN(d.getTime()) && pDateStr.includes('/')) {
                              const parts = pDateStr.split('/');
                              if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                          }
                          if (!isNaN(d.getTime())) {
                              const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                              normalizedDateStr = `${year}-${month}-${day}`;
                          } else { normalizedDateStr = pDateStr.split('T')[0]; }
                      } catch(e) { normalizedDateStr = pDateStr.split('T')[0]; }
                      
                      const sDate = startDate ? startDate : "2000-01-01";
                      const eDate = endDate ? endDate : "2100-01-01";
                      return normalizedDateStr >= sDate && normalizedDateStr <= eDate;
                   });
                }
                
                // 3. Hitung Summary Berdasarkan Rentang Tanggal (Sebelum Filter Status)
                let totalPkt = 0, totalSks = 0, totalPrs = 0, totalPnd = 0, totalCnc = 0;
                pkgs.forEach(p => {
                    if(!p) return;
                    totalPkt++;
                    let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                    if (stat === 'sukses') totalSks++;
                    else if (stat === 'cancel' || stat === 'batal') totalCnc++;
                    else if (stat === 'pending') totalPnd++;
                    else totalPrs++;
                });

                // 4. Filter Berdasarkan Tab Status (Untuk Laporan di Bawah)
                if (globalStatusFilter !== 'semua') {
                    pkgs = pkgs.filter(p => {
                        let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                        if (globalStatusFilter === 'proses') return stat === 'siap_antar' || stat === 'proses';
                        if (globalStatusFilter === 'cancel') return stat === 'cancel' || stat === 'batal';
                        return stat === globalStatusFilter;
                    });
                }

                const oReport = {}; const kReport = {};
                const summary = { 
                    totalPencairanOlshop: 0, totalDanaBelumCair: 0, totalDanaCair: 0, 
                    totalSetoranKurir: 0, totalPaketSukses: 0, totalOngkirTambahanKurir: 0, 
                    totalProfitPerusahaan: 0,
                    totalPkt, totalSks, totalPrs, totalPnd, totalCnc
                };

                // 5. Build Reports berdasarkan paket yang ter-filter
                pkgs.forEach(pkg => {
                    if(!pkg) return;
                    const statusPkg = String(pkg.status || '').toLowerCase().trim().replace(' ', '_');
                    const olshopName = String(pkg.olshopName || 'Tanpa Nama').toUpperCase();
                    const kurirName = String(pkg.kurirId || 'Tanpa Kurir').split('@')[0].toUpperCase();
                    const metode = String(pkg.metodeBayar || '').trim().toUpperCase();
                    const { hBarang, oDasar, oTambahan, oTotal } = getFinancials(pkg);

                    if (!oReport[olshopName]) oReport[olshopName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, pencairan: 0, potongan: 0, potonganDasar: 0, potonganTambahan: 0, totalDasar: 0, totalTambahan: 0, nilaiBarang: 0, nominalBelumCair: 0, paketBelumCairIds: [], paketBelumCairDetails: [], paketTerkait: [] };
                    if (!kReport[kurirName]) kReport[kurirName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, setoran: 0, rincianCash: 0, rincianMinusTf: 0, totalTfOlshop: 0, totalTfKantor: 0, totalTambahanOngkir: 0, tambahanOngkirCash: 0, tambahanOngkirTF: 0, paketTerkait: [], totalDasarOngkir: 0, profitPerusahaan: 0 };
                    
                    oReport[olshopName].paketTerkait.push(pkg);
                    kReport[kurirName].paketTerkait.push(pkg);

                    if (statusPkg === 'sukses') {
                        oReport[olshopName].totalSukses += 1;
                        kReport[kurirName].totalSukses += 1;
                        summary.totalPaketSukses += 1;
                        summary.totalOngkirTambahanKurir += oTambahan; 
                        summary.totalProfitPerusahaan += oDasar; 
                        
                        oReport[olshopName].totalDasar += oDasar;
                        oReport[olshopName].totalTambahan += oTambahan;
                        
                        kReport[kurirName].totalTambahanOngkir += oTambahan;
                        kReport[kurirName].totalDasarOngkir += oDasar;
                        kReport[kurirName].profitPerusahaan += oDasar; 

                        const isCair = String(pkg.statusPencairan || '').toLowerCase() === 'cair';

                        let pencairan = 0; let potongan = 0;
                        if (metode === 'TF OLSHOP') { potongan = oTotal; oReport[olshopName].potonganDasar += oDasar; oReport[olshopName].potonganTambahan += oTambahan; pencairan = -oTotal; } 
                        else if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') { pencairan = hBarang; }

                        oReport[olshopName].pencairan += pencairan;
                        if (metode === 'TF OLSHOP') oReport[olshopName].potongan += oTotal;
                        if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') oReport[olshopName].nilaiBarang += hBarang;
                        summary.totalPencairanOlshop += pencairan;

                        if (!isCair) {
                            oReport[olshopName].nominalBelumCair += pencairan;
                            oReport[olshopName].paketBelumCairIds.push(pkg.packageId); 
                            oReport[olshopName].paketBelumCairDetails.push(pkg);
                            summary.totalDanaBelumCair += pencairan;
                        } else { summary.totalDanaCair += pencairan; }

                        let setoranKurir = 0;
                        if (metode === 'TF OLSHOP' || metode === 'TF KANTOR') {
                            if (metode === 'TF OLSHOP') kReport[kurirName].totalTfOlshop += hBarang;
                            if (metode === 'TF KANTOR') kReport[kurirName].totalTfKantor += hBarang;
                            kReport[kurirName].rincianMinusTf += oTotal;
                            kReport[kurirName].tambahanOngkirTF += oTambahan; 
                            setoranKurir = -oTambahan; 
                        } else if (metode === 'CASH' || metode === 'COD') {
                            const cashDiterima = hBarang + oDasar + oTambahan; 
                            kReport[kurirName].rincianCash += cashDiterima;
                            kReport[kurirName].tambahanOngkirCash += oTambahan; 
                            setoranKurir = hBarang + oDasar; 
                        }
                        kReport[kurirName].setoran += setoranKurir;
                        summary.totalSetoranKurir += setoranKurir;

                    } else if (statusPkg === 'cancel' || statusPkg === 'batal') { oReport[olshopName].totalCancel += 1; kReport[kurirName].totalCancel += 1; } 
                    else if (statusPkg === 'pending') { oReport[olshopName].totalPending += 1; kReport[kurirName].totalPending += 1; } 
                    else { oReport[olshopName].totalProses += 1; kReport[kurirName].totalProses += 1; }
                });

                const activeOReport = Object.keys(oReport).filter(k => oReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = oReport[key]; return obj; }, {});
                const activeKReport = Object.keys(kReport).filter(k => kReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = kReport[key]; return obj; }, {});

                const sortedOlshop = Object.keys(activeOReport).map(k => ({ name: k, ...activeOReport[k] })).sort((a, b) => b.pencairan - a.pencairan);
                const sortedKurir = Object.keys(activeKReport).map(k => ({ name: k, ...activeKReport[k] })).sort((a, b) => b.setoran - a.setoran);

                return { filteredPkgs: pkgs, olshopReport: sortedOlshop, kurirReport: sortedKurir, globalSummary: summary };
            }, [packages, startDate, endDate, globalStatusFilter, searchQuery]);

                                    <div className="p-4 border-b border-app-border bg-app-header flex justify-between items-center">
                                        <div>
                                            <h3 className="font-bold text-slate-200 text-sm flex items-center">
                                                <i className="fas fa-calculator text-yellow-500 mr-2"></i> Pengaturan Biaya Operasional
                                            </h3>
                                            <p className="text-[10px] text-slate-400 mt-1">Beban operasional akan dibagi <b>merata</b> ke {jumlahKurirAktif} kurir aktif.</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider block mb-0.5">Total Ops</span>
                                            <span className="text-yellow-400 font-black text-sm md:text-lg bg-yellow-500/10 px-3 py-1 rounded-lg border border-yellow-500/20">{formatCurrency(totalBiayaOperasional)}</span>
                                        </div>
                                    </div>
                                    <div className="p-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 bg-[#0b1120]">
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1"><i className="fas fa-home mr-1"></i> Sewa Kos</label><input type="number" min="0" value={opsCosts.sewaKos} onChange={(e) => handleOpsChange('sewaKos', e.target.value)} className="w-full bg-app-header border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1"><i className="fas fa-bolt mr-1"></i> Listrik</label><input type="number" min="0" value={opsCosts.biayaListrik} onChange={(e) => handleOpsChange('biayaListrik', e.target.value)} className="w-full bg-app-header border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1"><i className="fas fa-wifi mr-1"></i> Internet</label><input type="number" min="0" value={opsCosts.biayaWifi} onChange={(e) => handleOpsChange('biayaWifi', e.target.value)} className="w-full bg-app-header border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1"><i className="fas fa-gas-pump mr-1"></i> Akomodasi</label><input type="number" min="0" value={opsCosts.akomodasi} onChange={(e) => handleOpsChange('akomodasi', e.target.value)} className="w-full bg-app-header border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1"><i className="fas fa-user-tie mr-1"></i> Gaji Admin</label><input type="number" min="0" value={opsCosts.gajiAdmin} onChange={(e) => handleOpsChange('gajiAdmin', e.target.value)} className="w-full bg-app-header border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1"><i className="fas fa-ellipsis-h mr-1"></i> Lain-lain</label><input type="number" min="0" value={opsCosts.lainLain} onChange={(e) => handleOpsChange('lainLain', e.target.value)} className="w-full bg-app-header border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50" /></div>
                                    </div>
                                </div>

                                <div className="bg-app-card rounded-xl shadow-sm border border-app-border overflow-hidden">
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <div className={`${!isAndroid ? 'min-w-[1050px]' : 'w-full'} flex flex-col`}>
                                            {kurirReport.length === 0 ? (
                                                <div className="p-8 text-center text-slate-500">Tidak ada data kurir.</div>
                                            ) : (
                                                !isAndroid ? (
                                                    <div className="grid grid-cols-[200px_1fr_1fr_130px_130px_120px_120px] gap-4 px-4 py-3 text-[10px] text-slate-400 font-bold uppercase tracking-widest bg-app-header border-b border-app-border items-center">
                                                        <div>NAMA KURIR</div>
                                                        <div>RINCIAN TARGET BEBAN</div>
                                                        <div>PENCAPAIAN PROGRESS</div>
                                                        <div className="text-right">SISA TARGET</div>
                                                        <div className="text-right">RATA-RATA KURIR</div>
                                                        <div className="text-right text-yellow-400">SISA PAKET (EST)</div>
                                                        <div className="text-center">STATUS</div>
                                                    </div>
                                                ) : (
                                                    <div className="px-4 py-3 text-[10px] text-slate-400 font-bold uppercase tracking-widest bg-app-header border-b border-app-border flex items-center">
                                                        <i className="fas fa-list mr-2"></i> LIST TARGET KURIR
                                                    </div>
                                                )
                                            )}
                                            
                                            {[...kurirReport].map((kur, idx) => {
                                                const ks = kurirSettings[kur.name] || { gajiHarian: 150000, tglMasuk: '', tglAkhir: '', hariLibur: 0 };
                                                const hKerjaKotor = (ks.tglMasuk && ks.tglAkhir) ? Math.max(0, Math.ceil((new Date(ks.tglAkhir) - new Date(ks.tglMasuk)) / (1000 * 60 * 60 * 24)) + 1) : 0;
                                                const hKerjaBersih = Math.max(0, hKerjaKotor - (Number(ks.hariLibur) || 0));
                                                const targetGajiFinal = hKerjaBersih * (Number(ks.gajiHarian) || 0);
                                                
                                                const targetFinal = targetGajiFinal + bebanOpsPerKurir;
                                                const pencapaian = kur.profitPerusahaan; 
                                                const isTercapai = pencapaian >= targetFinal;
                                                const sisaTarget = isTercapai ? 0 : targetFinal - pencapaian;
                                                
                                                const avgOngkir = kur.totalSukses > 0 ? pencapaian / kur.totalSukses : 0;
                                                const estimasiPaket = (avgOngkir > 0 && sisaTarget > 0) ? Math.ceil(sisaTarget / avgOngkir) : 0;
                                                const progressPct = targetFinal > 0 ? Math.min((pencapaian / targetFinal) * 100, 100).toFixed(1) : 0;

                                                if (isAndroid) {
                                                    return (
                                                        <div key={idx} className="flex flex-col gap-3 px-4 py-4 border-b border-app-border">
                                                            <div className="flex justify-between items-center border-b border-app-border pb-2">
                                                                <span className="font-bold text-slate-200 uppercase text-xs"><i className="fas fa-motorcycle mr-1.5 text-blue-400"></i> {kur.name}</span>
                                                                <span className="text-[10px] text-emerald-400 font-bold bg-emerald-900/30 px-2 py-0.5 rounded border border-emerald-800/50">{kur.totalSukses} Pkt Selesai</span>
                                                            </div>
                                                            <div className="flex flex-col gap-2 bg-[#0b1120] p-3 rounded-lg border border-app-border">
                                                                <div className="flex justify-between items-center text-[10px]">
                                                                    <span className="text-slate-500">Gaji Harian:</span>
                                                                    <input type="number" value={ks.gajiHarian} onChange={(e) => updateKurirSetting(kur.name, 'gajiHarian', e.target.value)} className="w-20 bg-app-header border border-app-border rounded px-1.5 py-1 text-right text-slate-200 font-bold outline-none focus:border-blue-500" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[10px]">
                                                                    <span className="text-slate-500">Tgl Masuk:</span>
                                                                    <input type="date" value={ks.tglMasuk} onChange={(e) => updateKurirSetting(kur.name, 'tglMasuk', e.target.value)} className="bg-app-header border border-app-border rounded px-1.5 py-1 text-slate-200 outline-none w-[110px]" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[10px]">
                                                                    <span className="text-slate-500">Tgl Akhir:</span>
                                                                    <input type="date" value={ks.tglAkhir} onChange={(e) => updateKurirSetting(kur.name, 'tglAkhir', e.target.value)} className="bg-app-header border border-app-border rounded px-1.5 py-1 text-slate-200 outline-none w-[110px]" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[10px]">
                                                                    <span className="text-slate-500">Izin/Libur:</span>
                                                                    <div className="flex items-center">
                                                                        <input type="number" value={ks.hariLibur || ''} onChange={(e) => updateKurirSetting(kur.name, 'hariLibur', e.target.value)} className="bg-app-header border border-app-border rounded px-1 py-0.5 text-slate-200 outline-none w-[40px] text-right focus:border-yellow-500" placeholder="0" />
                                                                        <span className="text-[9px] text-slate-500 ml-1">Hari</span>
                                                                    </div>
                                                                </div>
                                                                <div className="flex justify-between items-center text-[10px] pt-1 border-t border-app-border">
                                                                    <span className="text-slate-400 font-bold">Total Target (Gaji+Ops):</span>
                                                                    <span className="text-white font-black">{formatCurrency(targetFinal)}</span>
                                                                </div>
                                                            </div>
                                                            <div className="flex flex-col">
                                                                <div className="flex justify-between items-end mb-1">
                                                                    <span className="text-xs font-black text-emerald-400">{formatCurrency(pencapaian)}</span>
                                                                    <span className="text-[10px] font-bold text-slate-400">{progressPct}%</span>
                                                                </div>
                                                                <div className="w-full bg-[#0b1120] rounded-full h-2.5 overflow-hidden border border-app-border">
                                                                    <div className={`h-2.5 rounded-full transition-all duration-1000 progress-bar-striped ${isTercapai ? 'bg-emerald-500' : 'bg-yellow-500'}`} style={{ width: `${progressPct}%` }}></div>
                                                                </div>
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-2 mt-1">
                                                                <div className="bg-[#0b1120] p-2 rounded flex flex-col justify-center items-center border border-app-border">
                                                                    <span className="text-[9px] text-slate-500 font-bold uppercase mb-0.5">Sisa Target</span>
                                                                    <span className={`font-black text-xs ${isTercapai ? 'text-slate-600' : 'text-red-400'}`}>{isTercapai ? '0' : `-${formatCurrency(sisaTarget)}`}</span>
                                                                </div>
                                                                <div className="bg-[#0b1120] p-2 rounded flex flex-col justify-center items-center border border-app-border">
                                                                    <span className="text-[9px] text-slate-500 font-bold uppercase mb-0.5">Estimasi Pkt</span>
                                                                    <span className={`font-black text-xs ${isTercapai ? 'text-slate-600' : 'text-yellow-400'}`}>{isTercapai ? '-' : `${estimasiPaket} Pkt`}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                }

                                                return (
                                                    <div key={idx} className="grid grid-cols-[200px_1fr_1fr_130px_130px_120px_120px] gap-4 px-4 py-5 border-b border-app-border hover:bg-app-header transition-colors items-center">
                                                        <div className="flex flex-col">
                                                            <span className="font-bold text-slate-200 uppercase truncate text-sm" title={kur.name}>{kur.name}</span>
                                                            <span className="text-[10px] text-slate-500 mt-0.5">{kur.totalSukses} Pkt Selesai</span>
                                                        </div>
                                                        <div className="flex flex-col gap-1 pr-2 border-r border-app-border">
                                                            <div className="flex justify-between items-center text-[10px] mb-0.5"><span className="text-slate-500">Gaji Harian</span><input type="number" value={ks.gajiHarian} onChange={(e) => updateKurirSetting(kur.name, 'gajiHarian', e.target.value)} className="w-16 md:w-20 bg-[#0b1120] border border-app-border rounded px-1.5 py-0.5 text-right text-slate-200 font-bold outline-none focus:border-blue-500" /></div>
                                                            <div className="flex flex-col gap-0.5 text-[9px] mb-1">
                                                                <div className="flex justify-between items-center"><span className="text-slate-500">Tgl Masuk</span><input type="date" value={ks.tglMasuk} onChange={(e) => updateKurirSetting(kur.name, 'tglMasuk', e.target.value)} className="bg-[#0b1120] border border-app-border rounded px-1 py-0.5 text-slate-200 outline-none w-[90px]" /></div>
                                                                <div className="flex justify-between items-center"><span className="text-slate-500">Tgl Akhir</span><input type="date" value={ks.tglAkhir} onChange={(e) => updateKurirSetting(kur.name, 'tglAkhir', e.target.value)} className="bg-[#0b1120] border border-app-border rounded px-1 py-0.5 text-slate-200 outline-none w-[90px]" /></div>
                                                                <div className="flex justify-between items-center mt-0.5"><span className="text-slate-500">Izin/Libur</span><div className="flex items-center"><input type="number" value={ks.hariLibur || ''} onChange={(e) => updateKurirSetting(kur.name, 'hariLibur', e.target.value)} className="bg-[#0b1120] border border-app-border rounded px-1 py-0.5 text-slate-200 outline-none w-[50px] text-right focus:border-yellow-500" placeholder="0" /><span className="text-[9px] text-slate-500 ml-1 w-[36px]">Hari</span></div></div>
                                                            </div>
                                                            <div className="flex justify-between items-center text-[10px] bg-[#0b1120]/50 p-1 rounded mb-1 border border-app-border"><span className="text-slate-400">Kerja: <b className="text-white">{hKerjaBersih} Hari</b></span><span className="text-emerald-400 font-bold">{formatCurrency(targetGajiFinal)}</span></div>
                                                            <div className="flex justify-between items-center text-[10px]"><span className="text-slate-500">Beban Ops Global</span><span className="text-orange-400 font-bold">+{formatCurrency(bebanOpsPerKurir)}</span></div>
                                                            <div className="flex justify-between items-center text-[11px] mt-1 pt-1 border-t border-app-border"><span className="text-slate-400 font-bold">Total Target</span><span className="text-white font-black">{formatCurrency(targetFinal)}</span></div>
                                                        </div>
                                                        <div className="flex flex-col pr-4">
                                                            <div className="flex justify-between items-end mb-1.5"><span className="text-xs font-black text-emerald-400">{formatCurrency(pencapaian)}</span><span className="text-[10px] font-bold text-slate-400">{progressPct}%</span></div>
                                                            <div className="w-full bg-[#0b1120] rounded-full h-2.5 overflow-hidden border border-app-border"><div className={`h-2.5 rounded-full transition-all duration-1000 progress-bar-striped ${isTercapai ? 'bg-emerald-500' : 'bg-yellow-500'}`} style={{ width: `${progressPct}%` }}></div></div>
                                                        </div>
                                                        <div className="text-right flex flex-col justify-center"><span className={`font-black text-sm ${isTercapai ? 'text-slate-600' : 'text-red-400'}`}>{isTercapai ? '0' : `-${formatCurrency(sisaTarget)}`}</span></div>
                                                        <div className="text-right font-bold text-slate-300 flex items-center justify-end">{formatCurrency(avgOngkir)}</div>
                                                        <div className="text-right flex items-center justify-end gap-1.5"><span className={`text-xl font-black ${isTercapai ? 'text-slate-600' : 'text-yellow-400'}`}>{isTercapai ? '-' : `${estimasiPaket}`}</span>{!isTercapai && <span className="text-[9px] text-slate-400 font-bold">Pkt</span>}</div>
                                                        <div className="text-center">
                                                            {isTercapai ? (
                                                                <span className="bg-emerald-900/40 text-emerald-400 border border-emerald-500/50 px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider shadow-sm flex items-center justify-center"><i className="fas fa-star mr-1.5"></i> Lulus</span>
                                                            ) : (
                                                                <span className="bg-[#0b1120] text-slate-400 border border-app-border px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider shadow-sm flex items-center justify-center"><i className="fas fa-spinner fa-spin mr-1.5 text-yellow-500"></i> Proses</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW PROFIT */}
                        {activeTab === 'profit' && (
                            <div className="bg-app-card rounded-xl shadow-sm border border-app-border overflow-hidden">
                                <div className="p-3 md:p-4 border-b border-app-border bg-app-header flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h3 className="font-bold text-slate-200 text-xs md:text-sm flex items-center">
                                            <i className="fas fa-chart-line text-emerald-500 mr-2"></i> Profit Murni Perusahaan (Dari Ongkir Dasar)
                                        </h3>
                                        <p className="text-[10px] text-slate-400 mt-1">Ongkir Tambahan (Volume/Jarak) adalah 100% hak kurir.</p>
                                    </div>
                                    <div className="bg-[#0b1120] border border-app-border rounded-lg p-3 min-w-[140px] flex flex-col items-end shadow-inner">
                                        <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Total Profit Bersih</span>
                                        <span className="text-emerald-400 font-black text-sm md:text-lg">{formatCurrency(globalSummary.totalProfitPerusahaan)}</span>
                                    </div>
                                </div>
                                
                                <div className="overflow-x-auto custom-scrollbar">
                                    <div className={`${!isAndroid ? 'min-w-[850px]' : 'w-full'} flex flex-col`}>
                                        {kurirReport.length === 0 ? (
                                            <div className="p-8 text-center text-slate-500">Tidak ada data profit di periode ini.</div>
                                        ) : (
                                            !isAndroid ? (
                                                <div className="grid grid-cols-[250px_100px_1fr_1fr_1fr_1fr] gap-3 px-4 py-3 text-[10px] text-slate-400 font-bold uppercase tracking-widest bg-app-header border-b border-app-border items-center">
                                                    <div>KURIR PENGANTAR</div>
                                                    <div className="text-center">PKT SUKSES</div>
                                                    <div className="text-right text-emerald-400">ONGKIR DSR (PROFIT)</div>
                                                    <div className="text-right text-orange-400">ONGKIR TMBHN (HAK KURIR)</div>
                                                    <div className="text-right">TOTAL SEMUA ONGKIR</div>
                                                    <div className="text-right text-blue-400">AVG PROFIT / PKT</div>
                                                </div>
                                            ) : (
                                                <div className="px-4 py-3 text-[10px] text-slate-400 font-bold uppercase tracking-widest bg-app-header border-b border-app-border">RINCIAN PROFIT KURIR</div>
                                            )
                                        )}
                                        
                                        {[...kurirReport].sort((a,b) => b.profitPerusahaan - a.profitPerusahaan).map((kur, idx) => {
                                            const avgProfit = kur.totalSukses > 0 ? kur.profitPerusahaan / kur.totalSukses : 0;
                                            if (isAndroid) {
                                                return (
                                                    <div key={idx} className="flex flex-col gap-2 p-4 border-b border-app-border">
                                                        <div className="flex justify-between items-center"><span className="font-bold text-slate-200 uppercase text-xs"><i className="fas fa-motorcycle text-emerald-400 mr-2"></i>{kur.name}</span><span className="text-[10px] bg-app-border text-slate-300 px-2 py-0.5 rounded font-bold">{kur.totalSukses} Pkt</span></div>
                                                        <div className="grid grid-cols-2 gap-2 text-[10px] mt-1">
                                                            <div className="bg-[#0b1120] p-2 rounded flex justify-between border border-app-border"><span className="text-slate-400">Dsr(Profit):</span><span className="text-emerald-400 font-bold">{formatCurrency(kur.totalDasarOngkir)}</span></div>
                                                            <div className="bg-[#0b1120] p-2 rounded flex justify-between border border-app-border"><span className="text-slate-400">Tmbhn:</span><span className="text-orange-400 font-bold">{formatCurrency(kur.totalTambahanOngkir)}</span></div>
                                                            <div className="bg-emerald-900/20 p-2 rounded flex justify-between col-span-2 border border-emerald-900/50"><span className="text-emerald-500 font-bold">Avg / Pkt:</span><span className="text-emerald-400 font-black">{formatCurrency(avgProfit)}</span></div>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            return (
                                                <div key={idx} className="grid grid-cols-[250px_100px_1fr_1fr_1fr_1fr] gap-3 px-4 py-4 border-b border-app-border hover:bg-app-header transition-colors items-center">
                                                    <div className="flex items-center gap-3"><div className="w-8 h-8 rounded-full bg-emerald-900/30 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0"><i className="fas fa-motorcycle"></i></div><span className="font-bold text-slate-200 uppercase truncate text-xs md:text-sm" title={kur.name}>{kur.name}</span></div>
                                                    <div className="text-center font-bold text-slate-300">{kur.totalSukses} <span className="text-[9px] text-slate-500 font-normal">Pkt</span></div>
                                                    <div className="text-right font-black text-emerald-400 text-sm">{formatCurrency(kur.totalDasarOngkir)}</div>
                                                    <div className="text-right font-semibold text-orange-400">{formatCurrency(kur.totalTambahanOngkir)}</div>
                                                    <div className="text-right font-semibold text-slate-400">{formatCurrency(kur.totalDasarOngkir + kur.totalTambahanOngkir)}</div>
                                                    <div className="text-right font-black text-blue-400 text-sm">{formatCurrency(avgProfit)}</div>
                                                </div>
                                            );
                                        })}
                                        {kurirReport.length > 0 && (
                                            !isAndroid ? (
                                                <div className="grid grid-cols-[250px_100px_1fr_1fr_1fr_1fr] gap-3 px-4 py-4 border-t-2 border-emerald-600/50 bg-app-header rounded-b-xl items-center mt-1">
                                                    <div className="font-black text-slate-200 uppercase text-xs md:text-sm">TOTAL KESELURUHAN</div>
                                                    <div className="text-center font-black text-white">{kurirReport.reduce((acc, k) => acc + k.totalSukses, 0)} <span className="text-[9px] text-slate-400">Pkt</span></div>
                                                    <div className="text-right font-black text-emerald-400">{formatCurrency(kurirReport.reduce((acc, k) => acc + k.totalDasarOngkir, 0))}</div>
                                                    <div className="text-right font-black text-orange-400">{formatCurrency(kurirReport.reduce((acc, k) => acc + k.totalTambahanOngkir, 0))}</div>
                                                    <div className="text-right font-black text-white">{formatCurrency(kurirReport.reduce((acc, k) => acc + k.totalDasarOngkir + k.totalTambahanOngkir, 0))}</div>
                                                    <div className="text-right font-black text-blue-400">-</div>
                                                </div>
                                            ) : (
                                                <div className="flex flex-col gap-2 p-4 border-t-2 border-emerald-600/50 bg-app-header rounded-b-xl mt-1">
                                                    <div className="font-black text-slate-200 uppercase text-xs mb-1">TOTAL KESELURUHAN</div>
                                                    <div className="flex justify-between text-[10px]"><span className="text-slate-400">Total Pkt:</span><span className="text-white font-bold">{kurirReport.reduce((acc, k) => acc + k.totalSukses, 0)} Pkt</span></div>
                                                    <div className="flex justify-between text-[10px]"><span className="text-slate-400">Total Profit Dsr:</span><span className="text-emerald-400 font-bold">{formatCurrency(kurirReport.reduce((acc, k) => acc + k.totalDasarOngkir, 0))}</span></div>

                                                                </div>
                                                            </div>

                                                                <div className="p-3 md:p-4 bg-[#0b1120] border-t border-app-border">

                                                                    </div>
                                                                    
                                                                    {displayedPaket.length === 0 ? (
                                                                        <div className="text-center py-4 text-slate-500 text-xs italic">Tidak ada paket bawaan.</div>

                                                                        isAndroid ? (
                                                                            <div className="flex flex-col gap-2">
                                                                                {displayedPaket.map((pkg, pIdx) => {
                                                                                    const { hBarang, tagihan, oDasar, oTambahan } = getFinancials(pkg);
                                                                                    const isSukses = String(pkg.status || '').toLowerCase() === 'sukses';
                                                                                    const isCancel = String(pkg.status || '').toLowerCase() === 'cancel' || String(pkg.status || '').toLowerCase() === 'batal';
                                                                                    const isPending = String(pkg.status || '').toLowerCase() === 'pending';
                                                                                    let displayTgl = String(pkg.dateString || pkg.tanggal || '-');
                                                                                    if (displayTgl !== '-' && displayTgl.includes('T')) displayTgl = displayTgl.split('T')[0];

                                                                                            <div className="flex justify-between items-start">
                                                                                                <div>
                                                                                                    <div className="text-[#d9531e] font-mono font-bold bg-orange-900/20 px-1.5 py-0.5 rounded border border-orange-800/30 inline-block text-[10px]">{pkg.packageId}</div>
                                                                                                    <div className="text-slate-400 text-[8px] mt-1"><i className="fas fa-store mr-1"></i>{pkg.olshopName}</div>
                                                                                                    <div className="text-slate-200 font-bold text-xs mt-0.5">{pkg.customerName}</div>
                                                                                                </div>
                                                                                                <div className="flex flex-col items-end gap-1">
                                                                                                    <StatusBadgeAdmin status={pkg.status} />
                                                                                                </div>
                                                                                            </div>
                                                                                            <div className="grid grid-cols-2 gap-x-2 gap-y-1 text-[9px] mt-1 bg-[#0b1120] p-2 rounded border border-app-border">
                                                                                                <div className="text-slate-400">Tagihan: <span className="text-slate-200 font-bold">{formatCurrency(tagihan)}</span> ({pkg.metodeBayar || '-'})</div>
                                                                                                <div className="text-slate-400">Brg (Hrg): <span className={`${isSukses ? 'text-emerald-400' : 'text-slate-400'} font-bold`}>{formatCurrency(hBarang)}</span></div>
                                                                                                <div className="text-slate-400 col-span-2">Ongkir: <span className={`${isSukses ? 'text-red-400' : 'text-slate-400'} font-bold`}>{formatCurrency(oDasar)}</span> <span className={`${isSukses ? 'text-orange-400' : 'text-slate-500'} font-bold`}>+ {formatCurrency(oTambahan)}</span></div>
                                                                                            </div>

                                                                                                <div className="text-[8px] font-medium text-orange-300 bg-orange-900/20 p-1.5 rounded border border-orange-900/50 text-center leading-tight">Ket: {pkg.keterangan || pkg.keteranganStatus}</div>

                                                                                                <div className="text-slate-500 text-[8px]"><i className="far fa-calendar-alt mr-1"></i>{displayTgl} | <i className="fas fa-map-marker-alt mx-1"></i>{pkg.address || '-'}</div>

                                                                                                    {pkg.fotoBukti && <button onClick={(e) => { e.stopPropagation(); setSelectedImage(getFotoUrl(pkg)); }} className="text-blue-400 text-[10px] bg-blue-900/20 px-2 py-1 rounded border border-blue-900/50 hover:bg-blue-800"><i className="fas fa-image mr-1"></i>Foto</button>}

                                                                                                </div>
                                                                                            </div>
                                                                                        </div>
                                                                                    );
                                                                                })}

                                                                            <div className="overflow-x-auto rounded-lg border border-app-border custom-scrollbar">

                                                                                            <th className="py-2 px-3 font-bold">Resi & Tgl</th>
                                                                                            <th className="py-2 px-3 font-bold">Olshop & Penerima</th>
                                                                                            <th className="py-2 px-3 font-bold text-center">Status</th>
                                                                                            <th className="py-2 px-3 font-bold text-right">Tagihan & Mtd</th>
                                                                                            <th className="py-2 px-3 font-bold text-right">Brg (Hrg)</th>
                                                                                            <th className="py-2 px-3 font-bold text-right">Ongkir (Dsr+Tmb)</th>
                                                                                            <th className="py-2 px-3 font-bold text-center">Aksi / Bukti</th>

                                                                                        {displayedPaket.map((pkg, pIdx) => {
                                                                                            const { hBarang, tagihan, oDasar, oTambahan } = getFinancials(pkg);
                                                                                            const isSukses = String(pkg.status || '').toLowerCase() === 'sukses';
                                                                                            const isCancel = String(pkg.status || '').toLowerCase() === 'cancel' || String(pkg.status || '').toLowerCase() === 'batal';
                                                                                            const isPending = String(pkg.status || '').toLowerCase() === 'pending';
                                                                                            let displayTgl = String(pkg.dateString || pkg.tanggal || '-');
                                                                                            if (displayTgl !== '-' && displayTgl.includes('T')) displayTgl = displayTgl.split('T')[0];

                                                                                                        <div className="text-slate-400 text-[8px] mb-0.5 truncate max-w-[120px] md:max-w-[200px]"><i className="fas fa-store mr-1"></i>{pkg.olshopName}</div>
                                                                                                        <div className="text-slate-200 font-bold truncate max-w-[120px] md:max-w-[200px]" title={pkg.customerName}>{pkg.customerName}</div>
                                                                                                        <div className="text-slate-500 text-[8px] mt-0.5 truncate max-w-[120px] md:max-w-[200px]"><i className="fas fa-map-marker-alt mr-1"></i>{pkg.address || '-'}</div>
                                                                                                    </td>
                                                                                                    <td className="py-2 px-3 text-center whitespace-nowrap">
                                                                                                        <StatusBadgeAdmin status={pkg.status} />
                                                                                                        {(isCancel || isPending) && (pkg.keterangan || pkg.keteranganStatus) && (
                                                                                                            <div className="mt-1 w-full text-[8px] md:text-[9px] font-medium text-orange-300 break-words whitespace-normal bg-[#0b1120] p-1.5 rounded border border-app-border text-center leading-tight shadow-inner" title={pkg.keterangan || pkg.keteranganStatus}>

                                                                                                    <td className="py-2 px-3 text-right whitespace-nowrap">
                                                                                                        <div className="text-slate-200 font-bold">{formatCurrency(tagihan)}</div>

                                                                                                        <div className={`font-bold ${isSukses ? 'text-red-400' : 'text-slate-400'}`} title="Ongkir Dasar">{formatCurrency(oDasar)}</div>

                                                                                                    </td>
                                                                                                    <td className="py-2 px-3 text-center align-middle">
                                                                                                        <div className="flex flex-col items-center justify-center gap-1.5">
                                                                                                            {pkg.fotoBukti ? (
                                                                                                                <div

                                                                                                                    onClick={(e) => { e.stopPropagation(); setSelectedImage(getFotoUrl(pkg)); }}
                                                                                                                    title="Klik untuk perbesar"
                                                                                                                >
                                                                                                                    <img src={getFotoUrl(pkg)} className="w-full h-full object-cover" alt="Bukti" />
                                                                                                                </div>
                                                                                                            ) : (
                                                                                                                <div className="w-14 h-14 md:w-16 md:h-16 mx-auto rounded-md bg-app-header/50 border border-app-border border-dashed flex flex-col items-center justify-center text-slate-500" title="Tidak Ada Foto">
                                                                                                                    <i className="fas fa-image text-xs mb-1"></i>
                                                                                                                    <span className="text-[8px] font-bold">NO FOTO</span>
                                                                                                                </div>
                                                                                                            )}
                                                                                                            <button onClick={(e) => { e.stopPropagation(); openEditModal(pkg); }} className="w-full max-w-[80px] py-1 rounded bg-blue-600/20 border border-blue-500/30 hover:bg-blue-600 hover:text-white text-blue-400 flex items-center justify-center transition-colors shadow-sm mt-1" title="Edit Paket">
                                                                                                                <i className="fas fa-edit text-[10px] mr-1.5"></i> <span className="text-[10px] font-bold">Edit</span>
                                                                                                            </button>
                                                                                                        </div>
                                                                                                    </td>
                                                                                                </tr>
                                                                                            );
                                                                                        })}
                                                                                    </tbody>
                                                                                </table>
                                                                            </div>
                                                                        )
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );

                                                        <div className="w-10 h-10 rounded-full bg-blue-900/50 border border-blue-500/50 flex items-center justify-center text-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                                                            <i className="fas fa-sigma text-xl"></i>
                                                        </div>

                                                            <p className="text-[10px] text-blue-400 font-bold">Total dari {kurirReport.length} Kurir Aktif</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-4 md:gap-8 flex-wrap justify-center">
                                                        <div className="flex flex-col items-center justify-center bg-app-card px-4 py-2 rounded-lg border border-app-border">

                                                            <span className="text-base md:text-lg font-black text-white">{globalSummary.totalPaketSukses} <span className="text-[10px] text-slate-500 font-normal">Pkt</span></span>
                                                        </div>
                                                        <div className="flex flex-col items-center justify-center bg-emerald-900/20 px-4 py-2 rounded-lg border border-emerald-500/20">
                                                            <span className="text-[9px] font-bold text-emerald-500/70 uppercase mb-1"><i className="fas fa-money-bill-wave text-emerald-600 mr-1"></i> Wajib Setor Total</span>
                                                            <span className="text-base md:text-xl font-black text-emerald-400">{formatCurrency(globalSummary.totalSetoranKurir)}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

                return (

                                {syncMessage.text && (

                                        <span>{syncMessage.text}</span>
                                    </div>
                                )}
