<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin - Exceed Express</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d9488">
    <link rel="apple-touch-icon" href="Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Work Sans', system-ui, -apple-system, sans-serif; background:#f4f6f6; color:#0f172a; margin:0; }
        .glass-panel { background:#ffffff !important; border:1px solid #e5e7eb !important; border-radius:0.85rem !important; box-shadow:0 1px 3px rgba(15,23,42,0.06) !important; backdrop-filter:none !important; }
        .bg-app-dark { background:#f4f6f6 !important; }
        .custom-scrollbar::-webkit-scrollbar { width:6px; height:6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background:transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
        .animate-fade-in { animation: fadeIn .3s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }
        input, select, textarea { font-family: inherit; }
        ::-webkit-scrollbar { width:8px; height:8px; }
        ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-presets="env,react">

        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useMemo, Component } = React;

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) {
                console.error("Dashboard Crash:", error, errorInfo);
                this.setState({ errorInfo: error.toString() });
            }
            handleReset = () => { localStorage.clear(); window.location.reload(); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-[#f4f6f6] flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                            <div className="glass-panel p-10 rounded-3xl z-10 max-w-lg border border-red-500/20">
                                <i className="fas fa-exclamation-triangle text-red-600 text-6xl mb-6 filter "></i>
                                <h1 className="text-3xl font-black text-gray-900 mb-3">Terjadi Kesalahan Sistem</h1>
                                <p className="text-gray-500 text-sm mb-8 leading-relaxed">Data di memori browser Anda mengalami kerusakan (corrupt). Silakan klik tombol di bawah untuk membersihkan memori dan memuat ulang aplikasi secara normal.</p>
                                <button onClick={this.handleReset} className="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-4 px-8 rounded-2xl shadow-[0_0_20px_rgba(225,29,72,0.3)] transition-all flex items-center justify-center transform hover:scale-[1.02] active:scale-95">
                                    <i className="fas fa-sync-alt mr-3"></i> Bersihkan Memori & Muat Ulang
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const loadLocal = (key, fallback) => {
            try { 
                const item = localStorage.getItem(key); 
                return item ? JSON.parse(item) : fallback; 
            } catch (e) { 
                console.error(`Error loading ${key} from local storage`, e);
                return fallback; 
            }
        };

        const formatCurrency = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return 'Rp 0';
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };

        function DashboardApp() {
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVHojspm17WSZU42RaMtgiNWJikRfGyTlPh1FczlDJS9JL52PxX0d9RpkNJYM4g424/exec"; 
            const APPSHEET_APP_ID = "APLIKASEXCEED-327461285";

            const [layoutMode, setLayoutMode] = useState(() => loadLocal('exceed_layout_mode', 'web'));
            const [isMasterLoggedIn, setIsMasterLoggedIn] = useState(() => loadLocal('exceed_master_logged_in', false));
            const [isLoadingSync, setIsLoadingSync] = useState(false);
            const [syncMessage, setSyncMessage] = useState({ text: '', type: '' });
            
            const [loginUname, setLoginUname] = useState('');
            const [loginPass, setLoginPass] = useState('');

            const [packages, setPackages] = useState(() => loadLocal('exceed_master_packages', []));
            const [masterOlshops, setMasterOlshops] = useState([]);
            const [masterZonas, setMasterZonas] = useState([]);
            const [masterKurirs, setMasterKurirs] = useState([]);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [globalStatusFilter, setGlobalStatusFilter] = useState('semua');
            
            const [activeTab, setActiveTab] = useState('dashboard'); 
            
            const [expandedOlshops, setExpandedOlshops] = useState([]); 
            const [olshopFilters, setOlshopFilters] = useState({}); 
            const [expandedKurirs, setExpandedKurirs] = useState([]); 
            const [kurirFilters, setKurirFilters] = useState({}); 

            const [selectedImage, setSelectedImage] = useState(null);
            const [detailPkg, setDetailPkg] = useState(null);
            const [editSearch, setEditSearch] = useState('');
            
            const [isCairkanModalOpen, setIsCairkanModalOpen] = useState(false);
            const [selectedOlshopToCairkan, setSelectedOlshopToCairkan] = useState(null);
            const [isProcessingCair, setIsProcessingCair] = useState(false);

            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [isProcessingEdit, setIsProcessingEdit] = useState(false);
            const [editModal, setEditModal] = useState({
                packageId: '', olshopName: '', status: '', metodeBayar: '', 
                hargaPaket: 0, ongkirKode: '', ongkirDasar: 0, tambahanOngkir: 0, totalTagihan: 0,
                kurirId: '', tanggal: ''
            });

            const [opsCosts, setOpsCosts] = useState(() => loadLocal('exceed_ops_costs', { sewaKos: 0, biayaListrik: 0, biayaWifi: 0, akomodasi: 0, gajiAdmin: 0, lainLain: 0 }));
            const [workDays, setWorkDays] = useState(() => loadLocal('exceed_work_days', 26));
            const [kurirSettings, setKurirSettings] = useState(() => loadLocal('exceed_kurir_settings', {}));

            useEffect(() => { localStorage.setItem('exceed_layout_mode', JSON.stringify(layoutMode)); }, [layoutMode]);
            useEffect(() => { localStorage.setItem('exceed_master_logged_in', JSON.stringify(isMasterLoggedIn)); }, [isMasterLoggedIn]);
            useEffect(() => { localStorage.setItem('exceed_master_packages', JSON.stringify(packages)); }, [packages]);
            useEffect(() => { localStorage.setItem('exceed_ops_costs', JSON.stringify(opsCosts)); }, [opsCosts]);
            useEffect(() => { localStorage.setItem('exceed_work_days', JSON.stringify(workDays)); }, [workDays]);
            useEffect(() => { localStorage.setItem('exceed_kurir_settings', JSON.stringify(kurirSettings)); }, [kurirSettings]);

            const handleOpsChange = (field, value) => {
                const numValue = value === '' ? '' : Number(value);
                setOpsCosts(prev => ({ ...prev, [field]: numValue }));
            };

            const updateKurirSetting = (kurirName, field, value) => {
                setKurirSettings(prev => ({
                    ...prev,
                    [kurirName]: {
                        ...(prev[kurirName] || { gajiHarian: 150000, tglMasuk: '', tglAkhir: '', hariLibur: 0 }),
                        [field]: value
                    }
                }));
            };

            const toggleOlshop = (name) => setExpandedOlshops(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const toggleKurir = (name) => setExpandedKurirs(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const openCairkanModal = (olshop) => { setSelectedOlshopToCairkan(olshop); setIsCairkanModalOpen(true); };

            const getFinancials = (pkg) => {
                if(!pkg) return { hBarang:0, tagihan:0, oDasar:0, oTambahan:0, oTotal:0 };
                const hBarang = Number(pkg.hargaPaket) || 0;
                const tagihan = Number(pkg.totalTagihan) || 0;
                const selisihTagihan = tagihan - hBarang > 0 ? tagihan - hBarang : 0;
                
                let oTambahan = Number(pkg.tambahanOngkir) || 0;
                let oDasar = Number(pkg.ongkirDasar) || 0;
                
                if (oTambahan === 0 && oDasar > 0 && selisihTagihan > oDasar) oTambahan = selisihTagihan - oDasar;
                else if (oTambahan === 0 && oDasar === 0 && selisihTagihan > 0) oDasar = selisihTagihan;
                if (oDasar === 0 && oTambahan > 0 && selisihTagihan > oTambahan) oDasar = selisihTagihan - oTambahan;

                return { hBarang, tagihan, oDasar, oTambahan, oTotal: oDasar + oTambahan };
            };

            const getFotoUrl = (pkg) => {
                if(!pkg) return null;
                const fileKey = pkg.fotoBukti || pkg.foto_bukti || pkg.foto || pkg.bukti || pkg.gambar;
                if (!fileKey || String(fileKey).trim() === '') return null;
                if (String(fileKey).startsWith('http://') || String(fileKey).startsWith('https://')) return fileKey;
                return `https://www.appsheet.com/template/gettablefileurl?appName=${APPSHEET_APP_ID}&tableName=InputPaket&fileName=${encodeURIComponent(fileKey)}`;
            };

            const pkgInDateRange = (p) => {
                if (!startDate && !endDate) return true;
                let pDateStr = p.dateString || p.tanggal || '';
                if (!pDateStr) return false;
                let normalizedDateStr = "";
                try {
                    let d = new Date(pDateStr);
                    if (isNaN(d.getTime()) && pDateStr.includes('/')) {
                        const parts = pDateStr.split('/');
                        if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                    }
                    if (!isNaN(d.getTime())) {
                        const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                        normalizedDateStr = `${year}-${month}-${day}`;
                    } else { normalizedDateStr = pDateStr.split('T')[0]; }
                } catch(e) { normalizedDateStr = pDateStr.split('T')[0]; }
                const sDate = startDate ? startDate : "2000-01-01";
                const eDate = endDate ? endDate : "2100-01-01";
                return normalizedDateStr >= sDate && normalizedDateStr <= eDate;
            };

            const syncData = async (isLoginAttempt = false) => {
                setIsLoadingSync(true);
                if(!isLoginAttempt) setSyncMessage({ text: '', type: '' });
                
                try {
                    const response = await fetch(`${SCRIPT_URL}?action=getInitData&t=${new Date().getTime()}`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        setPackages(result.data.packages || []);
                        setMasterOlshops(result.data.olshop || []);
                        setMasterZonas(result.data.zona || []);
                        setMasterKurirs(result.data.kurir || []);

                        if(!isLoginAttempt) {
                            setSyncMessage({ text: 'Data berhasil diperbarui!', type: 'success' });
                            setTimeout(() => setSyncMessage({ text: '', type: '' }), 3000);
                        }
                        return true;
                    } else {
                        setSyncMessage({ text: 'Gagal memuat data dari server.', type: 'error' });
                        return false;
                    }
                } catch (error) {
                    setSyncMessage({ text: 'Koneksi terputus. Cek internet Anda.', type: 'error' });
                    return false;
                } finally {
                    setIsLoadingSync(false);
                }
            };

            useEffect(() => {
                if (isMasterLoggedIn) { syncData(); }
            }, [isMasterLoggedIn]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setSyncMessage({ text: 'Memeriksa kredensial...', type: 'info' });
                const validUser1 = loginUname === 'ellyasma991' && loginPass === '082213663662';
                const validUser2 = loginUname === 'idypandu' && loginPass === '082257849332';
                if (validUser1 || validUser2) {
                    setIsMasterLoggedIn(true);
                    setLoginUname(''); setLoginPass('');
                    syncData(true);
                } else {
                    setSyncMessage({ text: 'Username atau Password Salah.', type: 'error' });
                }
            };

            const handleLogout = () => { setIsMasterLoggedIn(false); setPackages([]); };

            const handleProsesCairkan = async () => {
                if (!selectedOlshopToCairkan || selectedOlshopToCairkan.paketBelumCairIds.length === 0) return;
                setIsProcessingCair(true);
                setSyncMessage({ text: `Memproses pencairan ${selectedOlshopToCairkan.name}...`, type: 'info' });
                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'cairkanPaket');
                    formData.append('packageIds', JSON.stringify(selectedOlshopToCairkan.paketBelumCairIds));
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setSyncMessage({ text: `Berhasil mencairkan ${result.updated} paket untuk ${selectedOlshopToCairkan.name}!`, type: 'success' });
                        setIsCairkanModalOpen(false);
                        syncData(); 
                    } else setSyncMessage({ text: 'Gagal memproses: ' + result.message, type: 'error' });
                } catch (error) { setSyncMessage({ text: 'Terjadi kesalahan jaringan.', type: 'error' }); } 
                finally { setIsProcessingCair(false); }
            };

            const openEditModal = (pkg) => {
                if(!pkg) return;
                let tgl = pkg.dateString || pkg.tanggalInput || '';
                if (tgl && tgl.includes('T')) tgl = tgl.split('T')[0];
                else if (tgl) {
                    try { const d = new Date(tgl); if (!isNaN(d.getTime())) tgl = d.toISOString().split('T')[0]; } 
                    catch(e) {}
                }

                setEditModal({
                    isOpen: true,
                    packageId: pkg.packageId || '',
                    olshopName: pkg.olshopName || '',
                    status: String(pkg.status || '').toUpperCase(),
                    metodeBayar: pkg.metodeBayar || '',
                    hargaPaket: pkg.hargaPaket || 0,
                    ongkirKode: pkg.ongkirKode || '',
                    ongkirDasar: pkg.ongkirDasar || 0,
                    tambahanOngkir: pkg.tambahanOngkir || 0,
                    totalTagihan: pkg.totalTagihan || 0,
                    kurirId: pkg.kurirEmailAsli || pkg.kurirId || '',
                    tanggal: tgl
                });
                setIsEditModalOpen(true);
            };

            const handleOngkirKodeChange = (val) => {
                const zona = masterZonas.find(z => z.id === val || z.nama === val);
                const harga = zona ? zona.harga : 0;
                setEditModal(prev => ({ ...prev, ongkirKode: val, ongkirDasar: harga }));
            };

            const handleEditSubmit = async (e) => {
                e.preventDefault();
                setIsProcessingEdit(true);
                setSyncMessage({ text: `Menyimpan perubahan resi ${editModal.packageId}...`, type: 'info' });

                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'editPackageMaster'); 
                    formData.append('packageId', editModal.packageId);
                    formData.append('olshopName', editModal.olshopName);
                    formData.append('status', editModal.status);
                    formData.append('metodeBayar', editModal.metodeBayar); 
                    formData.append('hargaPaket', editModal.hargaPaket);
                    formData.append('ongkirKode', editModal.ongkirKode); 
                    formData.append('tambahanOngkir', editModal.tambahanOngkir);
                    formData.append('ongkirDasar', Number(editModal.ongkirDasar) || 0);
                    formData.append('totalTagihan', Number(editModal.hargaPaket) + Number(editModal.ongkirDasar) + Number(editModal.tambahanOngkir));
                    formData.append('kurirId', editModal.kurirId); 
                    formData.append('tanggal', editModal.tanggal);

                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();

                    if (result.status === 'success') {
                        setSyncMessage({ text: 'Perubahan berhasil disimpan!', type: 'success' });
                        setIsEditModalOpen(false);
                        syncData(); 
                    } else setSyncMessage({ text: 'Gagal mengedit: ' + result.message, type: 'error' });
                } catch (error) { setSyncMessage({ text: 'Terjadi kesalahan jaringan.', type: 'error' }); } 
                finally { setIsProcessingEdit(false); }
            };

            const { filteredPkgs, olshopReport, kurirReport, globalSummary } = useMemo(() => {
                let pkgs = packages || [];
                
                // 1. Filter Search (Text)
                if (searchQuery) {
                    const q = searchQuery.toLowerCase().trim();
                    pkgs = pkgs.filter(p => String(p.customerName || '').toLowerCase().includes(q) || String(p.packageId || '').toLowerCase().includes(q) || String(p.olshopName || '').toLowerCase().includes(q) || String(p.kurirId || '').toLowerCase().includes(q));
                }
                
                // 2. Filter Tanggal (Date)
                if (startDate || endDate) {
                   pkgs = pkgs.filter(p => {
                      let pDateStr = p.dateString || p.tanggal || '';
                      if (!pDateStr) return false;
                      let normalizedDateStr = "";
                      try {
                          let d = new Date(pDateStr);
                          if (isNaN(d.getTime()) && pDateStr.includes('/')) {
                              const parts = pDateStr.split('/');
                              if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                          }
                          if (!isNaN(d.getTime())) {
                              const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                              normalizedDateStr = `${year}-${month}-${day}`;
                          } else { normalizedDateStr = pDateStr.split('T')[0]; }
                      } catch(e) { normalizedDateStr = pDateStr.split('T')[0]; }
                      
                      const sDate = startDate ? startDate : "2000-01-01";
                      const eDate = endDate ? endDate : "2100-01-01";
                      return normalizedDateStr >= sDate && normalizedDateStr <= eDate;
                   });
                }
                
                // 3. Hitung Summary Berdasarkan Rentang Tanggal (Sebelum Filter Status)
                let totalPkt = 0, totalSks = 0, totalPrs = 0, totalPnd = 0, totalCnc = 0;
                pkgs.forEach(p => {
                    if(!p) return;
                    totalPkt++;
                    let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                    if (stat === 'sukses') totalSks++;
                    else if (stat === 'cancel' || stat === 'batal') totalCnc++;
                    else if (stat === 'pending') totalPnd++;
                    else totalPrs++;
                });

                // 4. Filter Berdasarkan Tab Status (Untuk Laporan di Bawah)
                if (globalStatusFilter !== 'semua') {
                    pkgs = pkgs.filter(p => {
                        let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                        if (globalStatusFilter === 'proses') return stat === 'siap_antar' || stat === 'proses';
                        if (globalStatusFilter === 'cancel') return stat === 'cancel' || stat === 'batal';
                        return stat === globalStatusFilter;
                    });
                }

                const oReport = {}; const kReport = {};
                const summary = { 
                    totalPencairanOlshop: 0, totalDanaBelumCair: 0, totalDanaCair: 0, 
                    totalSetoranKurir: 0, totalPaketSukses: 0, totalOngkirTambahanKurir: 0, 
                    totalProfitPerusahaan: 0,
                    totalPkt, totalSks, totalPrs, totalPnd, totalCnc
                };

                // 5. Build Reports berdasarkan paket yang ter-filter
                pkgs.forEach(pkg => {
                    if(!pkg) return;
                    const statusPkg = String(pkg.status || '').toLowerCase().trim().replace(' ', '_');
                    const olshopName = String(pkg.olshopName || 'Tanpa Nama').toUpperCase();
                    const kurirName = String(pkg.kurirId || 'Tanpa Kurir').split('@')[0].toUpperCase();
                    const metode = String(pkg.metodeBayar || '').trim().toUpperCase();
                    const { hBarang, oDasar, oTambahan, oTotal } = getFinancials(pkg);

                    if (!oReport[olshopName]) oReport[olshopName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, pencairan: 0, potongan: 0, potonganDasar: 0, potonganTambahan: 0, totalDasar: 0, totalTambahan: 0, nilaiBarang: 0, nominalBelumCair: 0, paketBelumCairIds: [], paketBelumCairDetails: [], paketTerkait: [] };
                    if (!kReport[kurirName]) kReport[kurirName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, setoran: 0, rincianCash: 0, rincianMinusTf: 0, totalTfOlshop: 0, totalTfKantor: 0, totalTambahanOngkir: 0, tambahanOngkirCash: 0, tambahanOngkirTF: 0, paketTerkait: [], totalDasarOngkir: 0, profitPerusahaan: 0 };
                    
                    oReport[olshopName].paketTerkait.push(pkg);
                    kReport[kurirName].paketTerkait.push(pkg);

                    if (statusPkg === 'sukses') {
                        oReport[olshopName].totalSukses += 1;
                        kReport[kurirName].totalSukses += 1;
                        summary.totalPaketSukses += 1;
                        summary.totalOngkirTambahanKurir += oTambahan; 
                        summary.totalProfitPerusahaan += oDasar; 
                        
                        oReport[olshopName].totalDasar += oDasar;
                        oReport[olshopName].totalTambahan += oTambahan;
                        
                        kReport[kurirName].totalTambahanOngkir += oTambahan;
                        kReport[kurirName].totalDasarOngkir += oDasar;
                        kReport[kurirName].profitPerusahaan += oDasar; 

                        const isCair = String(pkg.statusPencairan || '').toLowerCase() === 'cair';

                        let pencairan = 0; let potongan = 0;
                        if (metode === 'TF OLSHOP') { potongan = oTotal; oReport[olshopName].potonganDasar += oDasar; oReport[olshopName].potonganTambahan += oTambahan; pencairan = -oTotal; } 
                        else if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') { pencairan = hBarang; }

                        oReport[olshopName].pencairan += pencairan;
                        if (metode === 'TF OLSHOP') oReport[olshopName].potongan += oTotal;
                        if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') oReport[olshopName].nilaiBarang += hBarang;
                        summary.totalPencairanOlshop += pencairan;

                        if (!isCair) {
                            oReport[olshopName].nominalBelumCair += pencairan;
                            oReport[olshopName].paketBelumCairIds.push(pkg.packageId); 
                            oReport[olshopName].paketBelumCairDetails.push(pkg);
                            summary.totalDanaBelumCair += pencairan;
                        } else { summary.totalDanaCair += pencairan; }

                        let setoranKurir = 0;
                        if (metode === 'TF OLSHOP' || metode === 'TF KANTOR') {
                            if (metode === 'TF OLSHOP') kReport[kurirName].totalTfOlshop += hBarang;
                            if (metode === 'TF KANTOR') kReport[kurirName].totalTfKantor += hBarang;
                            kReport[kurirName].rincianMinusTf += oTotal;
                            kReport[kurirName].tambahanOngkirTF += oTambahan; 
                            setoranKurir = -oTambahan; 
                        } else if (metode === 'CASH' || metode === 'COD') {
                            const cashDiterima = hBarang + oDasar + oTambahan; 
                            kReport[kurirName].rincianCash += cashDiterima;
                            kReport[kurirName].tambahanOngkirCash += oTambahan; 
                            setoranKurir = hBarang + oDasar; 
                        }
                        kReport[kurirName].setoran += setoranKurir;
                        summary.totalSetoranKurir += setoranKurir;

                    } else if (statusPkg === 'cancel' || statusPkg === 'batal') { oReport[olshopName].totalCancel += 1; kReport[kurirName].totalCancel += 1; } 
                    else if (statusPkg === 'pending') { oReport[olshopName].totalPending += 1; kReport[kurirName].totalPending += 1; } 
                    else { oReport[olshopName].totalProses += 1; kReport[kurirName].totalProses += 1; }
                });

                const activeOReport = Object.keys(oReport).filter(k => oReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = oReport[key]; return obj; }, {});
                const activeKReport = Object.keys(kReport).filter(k => kReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = kReport[key]; return obj; }, {});

                const sortedOlshop = Object.keys(activeOReport).map(k => ({ name: k, ...activeOReport[k] })).sort((a, b) => b.pencairan - a.pencairan);
                const sortedKurir = Object.keys(activeKReport).map(k => ({ name: k, ...activeKReport[k] })).sort((a, b) => b.setoran - a.setoran);

                return { filteredPkgs: pkgs, olshopReport: sortedOlshop, kurirReport: sortedKurir, globalSummary: summary };
            }, [packages, startDate, endDate, globalStatusFilter, searchQuery]);

                                                <div className="w-8 h-8 rounded-lg bg-yellow-500/20 flex items-center justify-center text-amber-600 mr-3 border border-yellow-500/30"><i className="fas fa-calculator"></i></div> 
                                                Pengaturan Biaya Operasional
                                            </h3>
                                            <p className="text-[11px] text-gray-500 mt-1">Beban operasional akan dibagi <b className="text-gray-800">merata</b> ke {jumlahKurirAktif} kurir aktif.</p>
                                        </div>
                                        <div className="text-right bg-white p-3 rounded-xl border border-gray-100 shadow-inner">
                                            <span className="text-[10px] text-gray-400 uppercase font-extrabold tracking-wider block mb-1">Total Ops</span>
                                            <span className="text-amber-600 font-black text-base md:text-xl">{formatCurrency(totalBiayaOperasional)}</span>
                                        </div>
                                    </div>
                                    <div className="p-5 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 bg-black/20">
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-gray-500 uppercase mb-2 ml-1 tracking-wider"><i className="fas fa-home mr-1.5 text-gray-400"></i> Sewa Kos</label><input type="number" min="0" value={opsCosts.sewaKos} onChange={(e) => handleOpsChange('sewaKos', e.target.value)} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50 shadow-inner" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-gray-500 uppercase mb-2 ml-1 tracking-wider"><i className="fas fa-bolt mr-1.5 text-yellow-500/70"></i> Listrik</label><input type="number" min="0" value={opsCosts.biayaListrik} onChange={(e) => handleOpsChange('biayaListrik', e.target.value)} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50 shadow-inner" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-gray-500 uppercase mb-2 ml-1 tracking-wider"><i className="fas fa-wifi mr-1.5 text-blue-600/80"></i> Internet</label><input type="number" min="0" value={opsCosts.biayaWifi} onChange={(e) => handleOpsChange('biayaWifi', e.target.value)} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50 shadow-inner" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-gray-500 uppercase mb-2 ml-1 tracking-wider"><i className="fas fa-gas-pump mr-1.5 text-red-600/70"></i> Akomodasi</label><input type="number" min="0" value={opsCosts.akomodasi} onChange={(e) => handleOpsChange('akomodasi', e.target.value)} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50 shadow-inner" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-gray-500 uppercase mb-2 ml-1 tracking-wider"><i className="fas fa-user-tie mr-1.5 text-purple-600/70"></i> Gaji Admin</label><input type="number" min="0" value={opsCosts.gajiAdmin} onChange={(e) => handleOpsChange('gajiAdmin', e.target.value)} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50 shadow-inner" /></div>
                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-gray-500 uppercase mb-2 ml-1 tracking-wider"><i className="fas fa-ellipsis-h mr-1.5 text-gray-400"></i> Lain-lain</label><input type="number" min="0" value={opsCosts.lainLain} onChange={(e) => handleOpsChange('lainLain', e.target.value)} className="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50 shadow-inner" /></div>
                                    </div>
                                </div>

                                <div className="glass-panel rounded-2xl overflow-hidden border border-gray-200">
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <div className={`${!isAndroid ? 'min-w-[1100px]' : 'w-full'} flex flex-col`}>
                                            {kurirReport.length === 0 ? (
                                                <div className="p-10 text-center text-gray-400 flex flex-col items-center"><i className="fas fa-box-open text-4xl mb-3 opacity-50"></i> Tidak ada data kurir.</div>
                                            ) : (
                                                !isAndroid ? (
                                                    <div className="grid grid-cols-[220px_1fr_1fr_140px_140px_130px_130px] gap-4 px-5 py-4 text-[10px] text-gray-500 font-extrabold uppercase tracking-widest bg-white/90 border-b border-gray-200 items-center">
                                                        <div>NAMA KURIR</div>
                                                        <div>RINCIAN TARGET BEBAN</div>
                                                        <div>PENCAPAIAN PROGRESS</div>
                                                        <div className="text-right">SISA TARGET</div>
                                                        <div className="text-right">RATA-RATA KURIR</div>
                                                        <div className="text-right text-amber-600">SISA PAKET (EST)</div>
                                                        <div className="text-center">STATUS</div>
                                                    </div>
                                                ) : (
                                                    <div className="px-5 py-4 text-[11px] text-gray-700 font-extrabold uppercase tracking-widest bg-white/90 border-b border-gray-200 flex items-center">
                                                        <i className="fas fa-list-ul mr-2 text-emerald-500"></i> LIST TARGET KURIR
                                                    </div>
                                                )
                                            )}
                                            
                                            {[...kurirReport].map((kur, idx) => {
                                                const ks = kurirSettings[kur.name] || { gajiHarian: 150000, tglMasuk: '', tglAkhir: '', hariLibur: 0 };
                                                const hKerjaKotor = (ks.tglMasuk && ks.tglAkhir) ? Math.max(0, Math.ceil((new Date(ks.tglAkhir) - new Date(ks.tglMasuk)) / (1000 * 60 * 60 * 24)) + 1) : 0;
                                                const hKerjaBersih = Math.max(0, hKerjaKotor - (Number(ks.hariLibur) || 0));
                                                const targetGajiFinal = hKerjaBersih * (Number(ks.gajiHarian) || 0);
                                                
                                                const targetFinal = targetGajiFinal + bebanOpsPerKurir;
                                                const pencapaian = kur.profitPerusahaan; 
                                                const isTercapai = pencapaian >= targetFinal;
                                                const sisaTarget = isTercapai ? 0 : targetFinal - pencapaian;
                                                
                                                const avgOngkir = kur.totalSukses > 0 ? pencapaian / kur.totalSukses : 0;
                                                const estimasiPaket = (avgOngkir > 0 && sisaTarget > 0) ? Math.ceil(sisaTarget / avgOngkir) : 0;
                                                const progressPct = targetFinal > 0 ? Math.min((pencapaian / targetFinal) * 100, 100).toFixed(1) : 0;

                                                if (isAndroid) {
                                                    return (
                                                        <div key={idx} className="flex flex-col gap-4 px-5 py-5 border-b border-gray-100 bg-gray-50/20">
                                                            <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                                                                <span className="font-bold text-gray-900 uppercase text-sm flex items-center"><i className="fas fa-motorcycle mr-2 text-blue-600 bg-blue-500/10 p-1.5 rounded-md"></i> {kur.name}</span>
                                                                <span className="text-[10px] text-emerald-600 font-bold bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">{kur.totalSukses} Pkt Selesai</span>
                                                            </div>
                                                            <div className="flex flex-col gap-2 bg-white/90 p-4 rounded-xl border border-gray-100 shadow-inner">
                                                                <div className="flex justify-between items-center text-[11px]">
                                                                    <span className="text-gray-500 font-medium">Gaji Harian:</span>
                                                                    <input type="number" value={ks.gajiHarian} onChange={(e) => updateKurirSetting(kur.name, 'gajiHarian', e.target.value)} className="w-24 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-right text-gray-900 font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[11px]">
                                                                    <span className="text-gray-500 font-medium">Tgl Masuk:</span>
                                                                    <input type="date" value={ks.tglMasuk} onChange={(e) => updateKurirSetting(kur.name, 'tglMasuk', e.target.value)} className="bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-gray-900 outline-none w-[120px] focus:border-blue-500" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[11px]">
                                                                    <span className="text-gray-500 font-medium">Tgl Akhir:</span>
                                                                    <input type="date" value={ks.tglAkhir} onChange={(e) => updateKurirSetting(kur.name, 'tglAkhir', e.target.value)} className="bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-gray-900 outline-none w-[120px] focus:border-blue-500" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[11px]">
                                                                    <span className="text-gray-500 font-medium">Izin/Libur:</span>
                                                                    <div className="flex items-center">
                                                                        <input type="number" value={ks.hariLibur || ''} onChange={(e) => updateKurirSetting(kur.name, 'hariLibur', e.target.value)} className="bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-gray-900 outline-none w-[50px] text-right focus:border-yellow-500" placeholder="0" />
                                                                        <span className="text-[10px] text-gray-400 ml-2">Hari</span>
                                                                    </div>
                                                                </div>
                                                                <div className="flex justify-between items-center text-[11px] pt-2 mt-1 border-t border-gray-100">
                                                                    <span className="text-gray-700 font-bold">Total Target (Gaji+Ops):</span>
                                                                    <span className="text-gray-900 font-black text-sm">{formatCurrency(targetFinal)}</span>
                                                                </div>
                                                            </div>
                                                            <div className="flex flex-col mt-1">
                                                                <div className="flex justify-between items-end mb-2">
                                                                    <span className="text-sm font-black text-emerald-600">{formatCurrency(pencapaian)}</span>
                                                                    <span className="text-[11px] font-black text-gray-900 bg-gray-50 px-2 py-0.5 rounded-md border border-gray-200">{progressPct}%</span>
                                                                </div>
                                                                <div className="w-full bg-white rounded-full h-3 overflow-hidden border border-gray-100 shadow-inner">
                                                                    <div className={`h-full rounded-full transition-all duration-1000 progress-bar-striped ${isTercapai ? 'bg-gradient-to-r from-emerald-500 to-green-400 shadow-md' : 'bg-gradient-to-r from-yellow-500 to-orange-400'}`} style={{ width: `${progressPct}%` }}></div>
                                                                </div>
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-3 mt-2">
                                                                <div className="bg-white/60 p-3 rounded-xl flex flex-col justify-center items-center border border-gray-100 shadow-sm">
                                                                    <span className="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Sisa Target</span>
                                                                    <span className={`font-black text-sm ${isTercapai ? 'text-gray-400' : 'text-red-600'}`}>{isTercapai ? '0' : `-${formatCurrency(sisaTarget)}`}</span>
                                                                </div>
                                                                <div className="bg-white/60 p-3 rounded-xl flex flex-col justify-center items-center border border-gray-100 shadow-sm">
                                                                    <span className="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">Estimasi Pkt</span>
                                                                    <span className={`font-black text-sm ${isTercapai ? 'text-gray-400' : 'text-amber-600'}`}>{isTercapai ? '-' : `${estimasiPaket} Pkt`}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                }

                                                return (
                                                    <div key={idx} className="grid grid-cols-[220px_1fr_1fr_140px_140px_130px_130px] gap-4 px-5 py-5 border-b border-gray-100 hover:bg-teal-50 transition-colors items-center">
                                                        <div className="flex flex-col">
                                                            <span className="font-bold text-gray-900 uppercase truncate text-sm flex items-center" title={kur.name}><i className="fas fa-motorcycle mr-2 text-blue-600 opacity-70"></i>{kur.name}</span>
                                                            <span className="text-[11px] text-emerald-600 font-medium mt-1 inline-block bg-emerald-500/10 px-2 py-0.5 rounded w-max border border-emerald-500/20">{kur.totalSukses} Pkt Selesai</span>
                                                        </div>
                                                        <div className="flex flex-col gap-1.5 pr-4 border-r border-gray-100">
                                                            <div className="flex justify-between items-center text-[10px] mb-1"><span className="text-gray-500 font-medium">Gaji Harian</span><input type="number" value={ks.gajiHarian} onChange={(e) => updateKurirSetting(kur.name, 'gajiHarian', e.target.value)} className="w-20 md:w-24 bg-white border border-gray-200 rounded-md px-2 py-1 text-right text-gray-900 font-bold outline-none focus:border-blue-500 transition-colors" /></div>
                                                            <div className="flex flex-col gap-1 text-[10px] mb-1 bg-white/60 p-2 rounded-lg border border-gray-100">
                                                                <div className="flex justify-between items-center"><span className="text-gray-500">Tgl Masuk</span><input type="date" value={ks.tglMasuk} onChange={(e) => updateKurirSetting(kur.name, 'tglMasuk', e.target.value)} className="bg-gray-50 border border-gray-200 rounded px-1.5 py-0.5 text-gray-900 outline-none w-[95px] focus:border-blue-500" /></div>
                                                                <div className="flex justify-between items-center"><span className="text-gray-500">Tgl Akhir</span><input type="date" value={ks.tglAkhir} onChange={(e) => updateKurirSetting(kur.name, 'tglAkhir', e.target.value)} className="bg-gray-50 border border-gray-200 rounded px-1.5 py-0.5 text-gray-900 outline-none w-[95px] focus:border-blue-500" /></div>
                                                                <div className="flex justify-between items-center mt-1 pt-1 border-t border-gray-100"><span className="text-gray-500">Izin/Libur</span><div className="flex items-center"><input type="number" value={ks.hariLibur || ''} onChange={(e) => updateKurirSetting(kur.name, 'hariLibur', e.target.value)} className="bg-gray-50 border border-gray-200 rounded px-1.5 py-0.5 text-gray-900 outline-none w-[50px] text-right focus:border-yellow-500" placeholder="0" /><span className="text-[9px] text-gray-400 ml-1.5 w-[25px]">Hari</span></div></div>
                                                            </div>
                                                            <div className="flex justify-between items-center text-[10px] bg-white/90 px-2 py-1.5 rounded-lg mb-1 border border-gray-100 shadow-inner"><span className="text-gray-500">Kerja: <b className="text-gray-900 bg-gray-50 px-1.5 py-0.5 rounded">{hKerjaBersih} Hr</b></span><span className="text-emerald-600 font-black">{formatCurrency(targetGajiFinal)}</span></div>
                                                            <div className="flex justify-between items-center text-[10px] px-1"><span className="text-gray-500">Beban Ops Global</span><span className="text-orange-600 font-bold">+{formatCurrency(bebanOpsPerKurir)}</span></div>
                                                            <div className="flex justify-between items-center text-[11px] mt-1 pt-2 border-t border-gray-200"><span className="text-gray-700 font-extrabold uppercase tracking-wider">Total Target</span><span className="text-gray-900 font-black bg-gray-50 px-2 py-0.5 rounded border border-gray-200">{formatCurrency(targetFinal)}</span></div>
                                                        </div>
                                                        <div className="flex flex-col pr-5">
                                                            <div className="flex justify-between items-end mb-2"><span className="text-sm font-black text-emerald-600 drop-shadow-md">{formatCurrency(pencapaian)}</span><span className="text-[10px] font-black text-gray-900 bg-gray-50 px-1.5 py-0.5 rounded">{progressPct}%</span></div>
                                                            <div className="w-full bg-white rounded-full h-3 overflow-hidden border border-gray-100 shadow-inner"><div className={`h-full rounded-full transition-all duration-1000 progress-bar-striped ${isTercapai ? 'bg-gradient-to-r from-emerald-500 to-green-400 shadow-md' : 'bg-gradient-to-r from-yellow-500 to-orange-400'}`} style={{ width: `${progressPct}%` }}></div></div>
                                                        </div>
                                                        <div className="text-right flex flex-col justify-center"><span className={`font-black text-sm md:text-base ${isTercapai ? 'text-gray-500' : 'text-red-600'}`}>{isTercapai ? '0' : `-${formatCurrency(sisaTarget)}`}</span></div>
                                                        <div className="text-right font-bold text-gray-700 flex items-center justify-end bg-white/60 py-1.5 px-2 rounded-lg border border-gray-100">{formatCurrency(avgOngkir)}</div>
                                                        <div className="text-right flex items-center justify-end gap-1.5"><span className={`text-xl font-black ${isTercapai ? 'text-gray-500' : 'text-amber-600 drop-shadow-md'}`}>{isTercapai ? '-' : `${estimasiPaket}`}</span>{!isTercapai && <span className="text-[10px] text-gray-400 font-bold uppercase">Pkt</span>}</div>
                                                        <div className="text-center">
                                                            {isTercapai ? (
                                                                <span className="bg-emerald-500/20 text-emerald-600 border border-emerald-500/40 px-3 py-2 rounded-xl text-[10px] font-extrabold uppercase tracking-widest shadow-md flex items-center justify-center"><i className="fas fa-star mr-1.5 text-amber-600"></i> Lulus</span>
                                                            ) : (
                                                                <span className="bg-white text-gray-500 border border-gray-200 px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-inner flex items-center justify-center"><i className="fas fa-spinner fa-spin mr-1.5 text-yellow-500"></i> Proses</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'kurir' && (
                            <div className="glass-panel rounded-2xl shadow-sm overflow-hidden">
                                <div className="p-4 md:p-5 border-b border-gray-100 bg-white/60 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-sm md:text-base flex items-center">
                                            <div className="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center text-emerald-600 mr-3 border border-emerald-500/30"><i className="fas fa-chart-line"></i></div>
                                            Profit Murni Perusahaan (Dari Ongkir Dasar)
                                        </h3>
                                        <p className="text-[11px] text-gray-500 mt-1 ml-11">Ongkir Tambahan (Volume/Jarak) adalah <b className="text-orange-600">100% hak kurir</b>.</p>
                                    </div>
                                    <div className="bg-white border border-gray-200 rounded-xl p-3 md:p-4 min-w-[160px] flex flex-col items-end shadow-inner">
                                        <span className="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-1">Total Profit Bersih</span>
                                        <span className="text-emerald-600 font-black text-lg md:text-2xl drop-shadow-md">{formatCurrency(globalSummary.totalProfitPerusahaan)}</span>
                                    </div>
                                </div>
                                
                                <div className="overflow-x-auto custom-scrollbar">
                                    <div className={`${!isAndroid ? 'min-w-[900px]' : 'w-full'} flex flex-col`}>
                                        {kurirReport.length === 0 ? (
                                            <div className="p-10 text-center text-gray-400 flex flex-col items-center"><i className="fas fa-folder-open text-4xl mb-3 opacity-50"></i> Tidak ada data profit di periode ini.</div>
                                        ) : (
                                            !isAndroid ? (
                                                <div className="grid grid-cols-[250px_100px_1fr_1fr_1fr_1fr] gap-4 px-5 py-4 text-[10px] text-gray-500 font-extrabold uppercase tracking-widest bg-white/90 border-b border-gray-200 items-center">
                                                    <div>KURIR PENGANTAR</div>
                                                    <div className="text-center">PKT SUKSES</div>
                                                    <div className="text-right text-emerald-600">ONGKIR DSR (PROFIT)</div>
                                                    <div className="text-right text-orange-600">ONGKIR TMBHN (HAK)</div>
                                                    <div className="text-right">TOTAL SEMUA ONGKIR</div>
                                                    <div className="text-right text-blue-600">AVG PROFIT / PKT</div>
                                                </div>
                                            ) : (
                                                <div className="px-5 py-4 text-[11px] text-gray-700 font-extrabold uppercase tracking-widest bg-white/90 border-b border-gray-200 flex items-center"><i className="fas fa-chart-pie mr-2 text-emerald-500"></i> RINCIAN PROFIT KURIR</div>
                                            )
                                        )}
                                        
                                        {[...kurirReport].sort((a,b) => b.profitPerusahaan - a.profitPerusahaan).map((kur, idx) => {
                                            const avgProfit = kur.totalSukses > 0 ? kur.profitPerusahaan / kur.totalSukses : 0;
                                            if (isAndroid) {
                                                return (
                                                    <div key={idx} className="flex flex-col gap-3 p-5 border-b border-gray-100 bg-gray-50/20">
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-bold text-gray-900 uppercase text-sm flex items-center"><i className="fas fa-motorcycle text-emerald-600 mr-2 bg-emerald-500/10 p-1.5 rounded-md"></i>{kur.name}</span>
                                                            <span className="text-[10px] bg-gray-50 text-gray-900 border border-gray-200 px-2.5 py-1 rounded-md font-bold shadow-inner">{kur.totalSukses} Pkt</span>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-3 text-[11px] mt-1">
                                                            <div className="bg-white/90 p-3 rounded-xl flex flex-col justify-between border border-emerald-500/20 shadow-inner"><span className="text-gray-500 font-medium mb-1">Dsr(Profit):</span><span className="text-emerald-600 font-bold text-sm">{formatCurrency(kur.totalDasarOngkir)}</span></div>
                                                            <div className="bg-white/90 p-3 rounded-xl flex flex-col justify-between border border-orange-500/20 shadow-inner"><span className="text-gray-500 font-medium mb-1">Tmbhn:</span><span className="text-orange-600 font-bold text-sm">{formatCurrency(kur.totalTambahanOngkir)}</span></div>
                                                            <div className="bg-gradient-to-r from-emerald-900/40 to-gray-100 p-3 rounded-xl flex justify-between items-center col-span-2 border border-emerald-500/30 shadow-sm"><span className="text-emerald-500 font-extrabold uppercase tracking-widest text-[10px]">Avg / Pkt:</span><span className="text-gray-900 font-black text-sm">{formatCurrency(avgProfit)}</span></div>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            return (
                                                <div key={idx} className="grid grid-cols-[250px_100px_1fr_1fr_1fr_1fr] gap-4 px-5 py-4 border-b border-gray-100 hover:bg-teal-50 transition-colors items-center">
                                                    <div className="flex items-center gap-3"><div className="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-600 shrink-0"><i className="fas fa-motorcycle"></i></div><span className="font-bold text-gray-900 uppercase truncate text-sm" title={kur.name}>{kur.name}</span></div>
                                                    <div className="text-center font-bold text-gray-900 bg-white py-1.5 rounded-lg border border-gray-100">{kur.totalSukses} <span className="text-[10px] text-gray-400 font-normal ml-1">Pkt</span></div>
                                                    <div className="text-right font-black text-emerald-600 text-sm drop-shadow-sm">{formatCurrency(kur.totalDasarOngkir)}</div>
                                                    <div className="text-right font-bold text-orange-600">{formatCurrency(kur.totalTambahanOngkir)}</div>
                                                    <div className="text-right font-bold text-gray-700">{formatCurrency(kur.totalDasarOngkir + kur.totalTambahanOngkir)}</div>
                                                    <div className="text-right font-black text-blue-600 text-sm">{formatCurrency(avgProfit)}</div>

                                    <div className="bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border border-blue-500/30 p-5 rounded-2xl mt-4 text-center shrink-0 shadow-inner relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-20 h-20 bg-blue-500/10 rounded-full blur-xl pointer-events-none"></div>
                                        <span className="text-[10px] text-blue-7000 font-extrabold uppercase tracking-widest mb-1.5 block relative z-10">Estimasi Tagihan Resi</span>
                                        <h3 className="text-3xl font-black text-gray-900 drop-shadow-md relative z-10">{formatCurrency(Number(editModal.hargaPaket) + Number(editModal.ongkirDasar) + Number(editModal.tambahanOngkir))}</h3>
                                    </div>

                                    <div className="flex gap-4 pt-5 border-t border-gray-100 shrink-0 relative z-10">
                                        <button type="button" onClick={() => setIsEditModalOpen(false)} disabled={isProcessingEdit} className="flex-1 py-3.5 rounded-xl font-bold text-gray-700 bg-gray-50 border border-gray-100 hover:bg-gray-100 transition-colors">Batal</button>
                                        <button type="submit" disabled={isProcessingEdit} className="flex-1 py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 transition-all flex justify-center items-center shadow-[0_10px_20px_rgba(59,130,246,0.2)] border border-blue-400/30">
                                            {isProcessingEdit ? <><i className="fas fa-spinner fa-spin mr-2"></i> Menyimpan...</> : <><i className="fas fa-save mr-2"></i> Simpan Edit</>}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL FOTO MEMBESAR */}
                    {selectedImage && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-gray-900/80 backdrop-blur-xl p-4 transition-opacity" onClick={() => setSelectedImage(null)}>
                            <div className="relative w-full max-w-lg md:max-w-3xl flex flex-col items-center transform transition-all scale-100 animate-fade-in" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setSelectedImage(null)} className="absolute -top-14 right-0 md:-right-14 text-gray-500 bg-white hover:bg-red-500 hover:text-teal-600 w-12 h-12 rounded-full flex items-center justify-center transition-all shadow-[0_5px_15px_rgba(0,0,0,0.5)] border border-gray-200 z-50">
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                                <div className="p-2 bg-white rounded-2xl border border-gray-200 shadow-[0_20px_50px_rgba(0,0,0,0.5)] w-full">
                                    <img src={selectedImage} alt="Foto Paket" className="w-full max-h-[75vh] object-contain rounded-xl bg-gray-100" />
                                </div>
                                <p className="text-gray-900 font-black mt-5 tracking-widest text-sm uppercase flex items-center bg-white/90 px-6 py-3 rounded-full border border-gray-200 shadow-lg backdrop-blur-sm">
                                    <i className="fas fa-camera mr-3 text-blue-600"></i> FOTO BUKTI PENGIRIMAN
                                </p>
                            </div>
                        </div>
                    )}

                    {/* MODAL DETAIL PAKET */}
                    {detailPkg && (() => {
                        const dfin = getFinancials(detailPkg);
                        const dkur = (masterKurirs||[]).find(k => k.id === detailPkg.kurirId);
                        const dst = String(detailPkg.status || '').toUpperCase();
                        const dstColor = dst==='SUKSES'?'bg-emerald-50 text-emerald-700 border-emerald-200':(dst==='CANCEL'?'bg-red-50 text-red-700 border-red-200':(dst==='PENDING'?'bg-amber-50 text-amber-700 border-amber-200':'bg-blue-50 text-blue-700 border-blue-200'));
                        const dCair = String(detailPkg.statusPencairan || '').toLowerCase() === 'cair';
                        const fotoUrl = getFotoUrl(detailPkg);
                        return (
                        <div className="fixed inset-0 z-[9998] flex items-center justify-center bg-gray-900/70 backdrop-blur-md p-4 animate-fade-in" onClick={() => setDetailPkg(null)}>
                            <div className="bg-white rounded-3xl border border-gray-200 shadow-[0_20px_50px_rgba(0,0,0,0.5)] w-full max-w-md overflow-hidden flex flex-col max-h-[85vh]" onClick={(e) => e.stopPropagation()}>
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center shrink-0 bg-gradient-to-r from-teal-50 to-blue-50">
                                    <h3 className="font-black text-gray-900 text-sm md:text-base flex items-center gap-2 min-w-0"><i className="fas fa-box-open text-teal-600 shrink-0"></i><span className="truncate">Detail Paket</span><span className="font-mono text-[10px] text-teal-700 bg-teal-100 px-2 py-0.5 rounded shrink-0">{detailPkg.packageId || '-'}</span></h3>
                                    <button onClick={() => setDetailPkg(null)} className="w-8 h-8 rounded-full bg-white text-gray-500 hover:bg-red-500 hover:text-white border border-gray-200 transition-all flex items-center justify-center shrink-0"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="overflow-y-auto custom-scrollbar flex-1 p-4 space-y-3">
                                    <div className="relative rounded-2xl overflow-hidden border border-gray-100 bg-gray-50 flex items-center justify-center" style={{minHeight:'160px'}}>
                                        {fotoUrl ? (
                                            <img src={fotoUrl} alt="Foto Paket" onClick={() => setSelectedImage(fotoUrl)} className="w-full max-h-[260px] object-contain cursor-zoom-in hover:opacity-90 transition-opacity" />
                                        ) : (
                                            <div className="flex flex-col items-center justify-center py-10 text-gray-300">
                                                <i className="fas fa-image text-4xl mb-2"></i>
                                                <span className="text-[11px] font-bold">Tidak ada foto bukti</span>
                                            </div>
                                        )}
                                        {fotoUrl && <span className="absolute bottom-2 right-2 bg-black/50 text-white text-[9px] font-bold px-2 py-1 rounded-full backdrop-blur-sm"><i className="fas fa-search-plus mr-1"></i> Klik untuk zoom</span>}
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="bg-orange-50 border border-orange-100 rounded-xl px-3 py-2">
                                            <div className="text-[9px] font-bold text-orange-500 uppercase tracking-wide flex items-center gap-1"><i className="fas fa-store"></i> Olshop</div>
                                            <div className="text-xs font-black text-gray-800 truncate mt-0.5">{detailPkg.olshopName || '-'}</div>
                                        </div>
                                        <div className="bg-blue-50 border border-blue-100 rounded-xl px-3 py-2">
                                            <div className="text-[9px] font-bold text-blue-500 uppercase tracking-wide flex items-center gap-1"><i className="fas fa-motorcycle"></i> Kurir</div>
                                            <div className="text-xs font-black text-gray-800 truncate mt-0.5">{dkur ? dkur.nama : (detailPkg.kurirId || '-')}</div>
                                        </div>
                                        <div className="bg-gray-50 border border-gray-100 rounded-xl px-3 py-2">
                                            <div className="text-[9px] font-bold text-gray-500 uppercase tracking-wide">Harga Paket</div>
                                            <div className="text-xs font-black text-gray-800 mt-0.5">Rp {formatCurrency(dfin.hBarang)}</div>
                                        </div>
                                        <div className="bg-gray-50 border border-gray-100 rounded-xl px-3 py-2">
                                            <div className="text-[9px] font-bold text-gray-500 uppercase tracking-wide">Ongkir</div>
                                            <div className="text-xs font-black text-gray-800 mt-0.5">Rp {formatCurrency(dfin.oTotal)}</div>
                                        </div>
                                        <div className="bg-emerald-50 border border-emerald-100 rounded-xl px-3 py-2 col-span-2">
                                            <div className="text-[9px] font-bold text-emerald-600 uppercase tracking-wide">Total Tagihan</div>
                                            <div className="text-sm font-black text-emerald-700 mt-0.5">Rp {formatCurrency(dfin.tagihan)}</div>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 flex-wrap">
                                        <span className={`text-[10px] font-black px-2.5 py-1 rounded-full border ${dstColor}`}><i className="fas fa-truck mr-1"></i> {dst || '-'}</span>
                                        <span className={`text-[10px] font-black px-2.5 py-1 rounded-full border ${dCair ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-orange-50 text-orange-700 border-orange-200'}`}><i className={`fas ${dCair ? 'fa-check-circle' : 'fa-clock'} mr-1`}></i> {dCair ? 'SUDAH CAIR' : 'BELUM CAIR'}</span>
                                        {detailPkg.metodeBayar && <span className="text-[10px] font-black px-2.5 py-1 rounded-full border bg-purple-50 text-purple-700 border-purple-200"><i className="fas fa-wallet mr-1"></i> {detailPkg.metodeBayar}</span>}
                                    </div>
                                    {detailPkg.customerName && <div className="text-[11px] text-gray-500 bg-gray-50 border border-gray-100 rounded-xl px-3 py-2"><i className="fas fa-user mr-1.5 text-gray-400"></i>Penerima: <span className="font-bold text-gray-700">{detailPkg.customerName}</span></div>}
                                </div>
                            </div>
                        </div>
                        );
                    })()}
                </div>
            );
        }

        const App = () => (
            <ErrorBoundary>
                <DashboardApp />
            </ErrorBoundary>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    
    </script>
</body>
</html>
