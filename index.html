                                    <i className="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-500"></i>
                                    <input type="text" required value={loginUname} onChange={(e) => setLoginUname(e.target.value)} placeholder="Username ID" className="w-full pl-12 pr-4 py-3.5 bg-app-header border border-app-border rounded-xl text-sm outline-none focus:border-emerald-500 text-white transition-all font-medium placeholder-slate-500" disabled={isLoadingSync} />

                                <div className="relative">
                                    <i className="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-500"></i>

                                </div>
                                <button type="submit" disabled={isLoadingSync} className={`w-full text-white font-bold py-3.5 rounded-xl shadow-lg transition-all transform active:scale-95 flex justify-center items-center mt-2 ${isLoadingSync ? 'bg-slate-600 cursor-not-allowed shadow-none' : 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-900/50'}`}>
                                    {isLoadingSync ? <><i className="fas fa-sync-alt animate-spin mr-2"></i> Memproses...</> : 'Masuk Dashboard'}
                                </button>
                            </form>
                        </div>
                    </div>
                );

            return (
                <div className="h-screen bg-app-dark font-sans w-full mx-auto relative flex flex-col overflow-hidden">

                            <div className="hidden lg:flex">

                                        <button onClick={() => setActiveTab('olshop')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'olshop' ? 'bg-[#d9531e] text-white' : 'bg-app-card text-slate-400 border border-app-border'}`}>Olshop</button>

                                {isAndroid && <MenuGrid />}
                                {renderContent()}

                                <div className="p-5 border-b border-app-border bg-app-header flex justify-between items-center">

                                    <button onClick={() => setIsCairkanModalOpen(false)} className="text-slate-400 hover:text-white transition-colors"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="p-5">
                                    <p className="text-slate-300 text-sm mb-4">Anda akan memproses pencairan dana untuk Olshop berikut:</p>
                                    <div className="bg-[#0b1120] rounded-xl p-4 border border-app-border mb-5">
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">Nama Olshop</span>
                                            <span className="text-white font-bold">{selectedOlshopToCairkan.name}</span>
                                        </div>
                                        <div className="flex justify-between items-center mb-2">

                                        </div>

                                            <span className="text-emerald-500/70 text-xs font-bold uppercase tracking-wider">Total Dana Cair</span>
                                            <span className="text-emerald-400 font-black text-lg">{formatCurrency(selectedOlshopToCairkan.nominalBelumCair)}</span>

                                    </div>

                                            {isProcessingCair ? <><i className="fas fa-spinner fa-spin mr-2"></i> Memproses...</> : 'Ya, Cairkan Sekarang'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT DATA PAKET */}
                    {isEditModalOpen && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                            <div className="bg-app-card rounded-2xl border border-app-border shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[95vh]">
                                <div className="p-4 md:p-5 border-b border-app-border bg-app-header flex justify-between items-center shrink-0">
                                    <h3 className="font-bold text-white flex items-center"><i className="fas fa-edit text-blue-500 mr-2"></i> Edit Data Paket</h3>
                                    <button onClick={() => setIsEditModalOpen(false)} className="text-slate-400 hover:text-white transition-colors"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                
                                <form onSubmit={handleEditSubmit} className="p-4 md:p-5 space-y-4 overflow-y-auto custom-scrollbar flex-1">
                                    <div className="bg-[#0b1120] p-3 rounded-lg border border-app-border text-center mb-2">
                                        <span className="text-xs text-slate-400 font-bold uppercase tracking-widest">Resi Pengiriman</span>
                                        <h2 className="text-lg font-black text-blue-400 font-mono tracking-widest">{editModal.packageId}</h2>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-bold uppercase mb-1">Nama Toko (Olshop)</label>
                                            <select value={editModal.olshopName} onChange={(e) => setEditModal({...editModal, olshopName: e.target.value})} className="bg-[#0b1120] border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500 cursor-pointer">
                                                <option value="">-- Pilih Olshop --</option>
                                                {!masterOlshops.some(o => o.nama === editModal.olshopName) && editModal.olshopName && (<option value={editModal.olshopName}>{editModal.olshopName}</option>)}
                                                {masterOlshops.map((o, i) => <option key={i} value={o.nama}>{o.nama}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-bold uppercase mb-1">Email / ID Kurir</label>
                                            <select value={editModal.kurirId} onChange={(e) => setEditModal({...editModal, kurirId: e.target.value})} className="bg-[#0b1120] border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500 cursor-pointer">
                                                <option value="">-- Pilih Kurir --</option>
                                                {!masterKurirs.some(k => k.id === editModal.kurirId) && editModal.kurirId && (<option value={editModal.kurirId}>{editModal.kurirId}</option>)}
                                                {masterKurirs.map((k, i) => <option key={i} value={k.id}>{k.nama}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-bold uppercase mb-1">Status Pengiriman</label>
                                            <select value={editModal.status} onChange={(e) => setEditModal({...editModal, status: e.target.value})} className="bg-[#0b1120] border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500 cursor-pointer">
                                                <option value="SUKSES">Sukses</option>
                                                <option value="SIAP_ANTAR">Proses (Siap Antar)</option>
                                                <option value="PENDING">Pending</option>
                                                <option value="CANCEL">Cancel / Batal</option>
                                            </select>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-bold uppercase mb-1">Metode Bayar</label>
                                            <select value={editModal.metodeBayar} onChange={(e) => setEditModal({...editModal, metodeBayar: e.target.value})} className="bg-[#0b1120] border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500 cursor-pointer">
                                                <option value="">-- KOSONG / BELUM ADA --</option>
                                                <option value="CASH">CASH</option>
                                                <option value="TF OLSHOP">TF OLSHOP</option>
                                                <option value="TF KANTOR">TF KANTOR</option>
                                                <option value="COD">COD</option>
                                            </select>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-bold uppercase mb-1">Harga Barang</label>
                                            <input type="number" value={editModal.hargaPaket} onChange={(e) => setEditModal({...editModal, hargaPaket: e.target.value})} className="bg-[#0b1120] border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500" />
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-bold uppercase mb-1">Kode Ongkir (TRF/ZONA)</label>
                                            <select value={editModal.ongkirKode} onChange={(e) => handleOngkirKodeChange(e.target.value)} className="bg-[#0b1120] border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500 cursor-pointer">
                                                <option value="">-- Pilih TRF / ZONA --</option>
                                                {!masterZonas.some(z => z.id === editModal.ongkirKode) && editModal.ongkirKode && (<option value={editModal.ongkirKode}>{editModal.ongkirKode}</option>)}
                                                {masterZonas.map((z, i) => <option key={i} value={z.id}>{z.id} - {z.nama} (Rp {formatCurrency(z.harga)})</option>)}
                                            </select>
                                            {editModal.ongkirDasar > 0 && <span className="text-[9px] text-emerald-400 mt-1 font-bold">Terbaca: Rp {formatCurrency(editModal.ongkirDasar)}</span>}
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-bold uppercase mb-1">Tambahan Ongkir (Vol)</label>
                                            <input type="number" value={editModal.tambahanOngkir} onChange={(e) => setEditModal({...editModal, tambahanOngkir: e.target.value})} className="bg-[#0b1120] border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500" />
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-bold uppercase mb-1">Ubah Tanggal</label>
                                            <input type="date" value={editModal.tanggal} onChange={(e) => setEditModal({...editModal, tanggal: e.target.value})} className="bg-[#0b1120] border border-app-border rounded-lg px-3 py-2 text-sm text-white font-bold outline-none focus:border-blue-500" />
                                        </div>
                                    </div>

                                    <div className="bg-blue-900/20 border border-blue-500/30 p-3 rounded-xl mt-2 text-center shrink-0">
                                        <span className="text-[10px] text-blue-400 font-bold uppercase tracking-widest mb-1 block">Estimasi Tagihan Resi</span>
                                        <h3 className="text-2xl font-black text-white">{formatCurrency(Number(editModal.hargaPaket) + Number(editModal.ongkirDasar) + Number(editModal.tambahanOngkir))}</h3>
                                    </div>

                                    <div className="flex gap-3 pt-4 border-t border-app-border shrink-0">
                                        <button type="button" onClick={() => setIsEditModalOpen(false)} disabled={isProcessingEdit} className="flex-1 py-3 rounded-xl font-bold text-slate-300 bg-app-border hover:bg-slate-700 transition-colors">Batal</button>
                                        <button type="submit" disabled={isProcessingEdit} className="flex-1 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-500 transition-colors flex justify-center items-center shadow-lg shadow-blue-900/50">
                                            {isProcessingEdit ? <><i className="fas fa-spinner fa-spin mr-2"></i> Menyimpan...</> : <><i className="fas fa-save mr-2"></i> Simpan Edit</>}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL FOTO MEMBESAR */}
                    {selectedImage && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/90 backdrop-blur-sm p-4 transition-opacity" onClick={() => setSelectedImage(null)}>
                            <div className="relative w-full max-w-lg md:max-w-2xl flex flex-col items-center transform transition-all scale-100 animate-fade-in" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setSelectedImage(null)} className="absolute -top-12 right-0 text-white bg-red-500/80 hover:bg-red-500 w-10 h-10 rounded-full flex items-center justify-center transition-colors shadow-lg border border-white/20">
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                                <img src={selectedImage} alt="Foto Paket" className="w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border-4 border-white/10 bg-black/50" />
                                <p className="text-white font-black mt-4 tracking-widest text-sm uppercase flex items-center bg-black/50 px-4 py-2 rounded-full border border-white/10">
                                    <i className="fas fa-camera mr-2 text-blue-400"></i> FOTO PAKET
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const App = () => (
            <ErrorBoundary>
                <DashboardApp />
            </ErrorBoundary>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
