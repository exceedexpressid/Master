<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Admin - Exceed Express</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <link rel="apple-touch-icon" href="Logo.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Modern UI -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-dark': '#020617',     /* Slate 950 */
                        'app-card': '#0f172a',     /* Slate 900 */
                        'app-header': '#0f172a',   /* Slate 900 */
                        'app-border': '#1e293b',   /* Slate 800 */
                        'app-accent': '#10b981'    /* Emerald 500 */
                    },
                    boxShadow: {
                        'glass': '0 4px 30px rgba(0, 0, 0, 0.1)',
                        'glow-emerald': '0 0 20px rgba(16, 185, 129, 0.15)',
                        'glow-blue': '0 0 20px rgba(59, 130, 246, 0.15)',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>

    <style>
        body { 
            touch-action: manipulation; 
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            font-family: 'Inter', system-ui, sans-serif; 
            color: #f8fafc; 
            overflow: hidden; 
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-header {
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Custom Scrollbar for Web */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(30, 41, 59, 0.8); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(51, 65, 85, 0.8); }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .progress-bar-striped {
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
            background-size: 1rem 1rem;
        }

        /* Number Input Reset */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* Select Dropdown Reset */
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 1rem center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        /* Override Calendar Picker Icon in Webkit */
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; transition: 0.2s; }
        ::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    </style>
</head>
<body class="antialiased text-slate-200 selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useMemo, Component } = React;

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) {
                console.error("Dashboard Crash:", error, errorInfo);
                this.setState({ errorInfo: error.toString() });
            }
            handleReset = () => { localStorage.clear(); window.location.reload(); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-app-dark flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                            <div className="glass-panel p-10 rounded-3xl z-10 max-w-lg border border-red-500/20">
                                <i className="fas fa-exclamation-triangle text-red-400 text-6xl mb-6 filter drop-shadow-[0_0_15px_rgba(248,113,113,0.5)]"></i>
                                <h1 className="text-3xl font-black text-white mb-3">Terjadi Kesalahan Sistem</h1>
                                <p className="text-slate-400 text-sm mb-8 leading-relaxed">Data di memori browser Anda mengalami kerusakan (corrupt). Silakan klik tombol di bawah untuk membersihkan memori dan memuat ulang aplikasi secara normal.</p>
                                <button onClick={this.handleReset} className="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-4 px-8 rounded-2xl shadow-[0_0_20px_rgba(225,29,72,0.3)] transition-all flex items-center justify-center transform hover:scale-[1.02] active:scale-95">
                                    <i className="fas fa-sync-alt mr-3"></i> Bersihkan Memori & Muat Ulang
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const loadLocal = (key, fallback) => {
            try { 
                const item = localStorage.getItem(key); 
                return item ? JSON.parse(item) : fallback; 
            } catch (e) { 
                console.error(`Error loading ${key} from local storage`, e);
                return fallback; 
            }
        };

        const formatCurrency = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return 'Rp 0';
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };

        function DashboardApp() {
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVHojspm17WSZU42RaMtgiNWJikRfGyTlPh1FczlDJS9JL52PxX0d9RpkNJYM4g424/exec"; 
            const APPSHEET_APP_ID = "APLIKASEXCEED-327461285";

            const [layoutMode, setLayoutMode] = useState(() => loadLocal('exceed_layout_mode', 'web'));
            const [isMasterLoggedIn, setIsMasterLoggedIn] = useState(() => loadLocal('exceed_master_logged_in', false));
            const [isLoadingSync, setIsLoadingSync] = useState(false);
            const [syncMessage, setSyncMessage] = useState({ text: '', type: '' });
            
            const [loginUname, setLoginUname] = useState('');
            const [loginPass, setLoginPass] = useState('');

            const [packages, setPackages] = useState(() => loadLocal('exceed_master_packages', []));
            const [masterOlshops, setMasterOlshops] = useState([]);
            const [masterZonas, setMasterZonas] = useState([]);
            const [masterKurirs, setMasterKurirs] = useState([]);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [globalStatusFilter, setGlobalStatusFilter] = useState('semua');
            
            const [activeTab, setActiveTab] = useState('olshop'); 
            
            const [expandedOlshops, setExpandedOlshops] = useState([]); 
            const [olshopFilters, setOlshopFilters] = useState({}); 
            const [expandedKurirs, setExpandedKurirs] = useState([]); 
            const [kurirFilters, setKurirFilters] = useState({}); 

            const [selectedImage, setSelectedImage] = useState(null);
            
            const [isCairkanModalOpen, setIsCairkanModalOpen] = useState(false);
            const [selectedOlshopToCairkan, setSelectedOlshopToCairkan] = useState(null);
            const [isProcessingCair, setIsProcessingCair] = useState(false);

            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [isProcessingEdit, setIsProcessingEdit] = useState(false);
            const [editModal, setEditModal] = useState({
                packageId: '', olshopName: '', status: '', metodeBayar: '', 
                hargaPaket: 0, ongkirKode: '', ongkirDasar: 0, tambahanOngkir: 0, 
                kurirId: '', tanggal: ''
            });

            const [opsCosts, setOpsCosts] = useState(() => loadLocal('exceed_ops_costs', { sewaKos: 0, biayaListrik: 0, biayaWifi: 0, akomodasi: 0, gajiAdmin: 0, lainLain: 0 }));
            const [workDays, setWorkDays] = useState(() => loadLocal('exceed_work_days', 26));
            const [kurirSettings, setKurirSettings] = useState(() => loadLocal('exceed_kurir_settings', {}));

            useEffect(() => { localStorage.setItem('exceed_layout_mode', JSON.stringify(layoutMode)); }, [layoutMode]);
            useEffect(() => { localStorage.setItem('exceed_master_logged_in', JSON.stringify(isMasterLoggedIn)); }, [isMasterLoggedIn]);
            useEffect(() => { localStorage.setItem('exceed_master_packages', JSON.stringify(packages)); }, [packages]);
            useEffect(() => { localStorage.setItem('exceed_ops_costs', JSON.stringify(opsCosts)); }, [opsCosts]);
            useEffect(() => { localStorage.setItem('exceed_work_days', JSON.stringify(workDays)); }, [workDays]);
            useEffect(() => { localStorage.setItem('exceed_kurir_settings', JSON.stringify(kurirSettings)); }, [kurirSettings]);

            const handleOpsChange = (field, value) => {
                const numValue = value === '' ? '' : Number(value);
                setOpsCosts(prev => ({ ...prev, [field]: numValue }));
            };

            const updateKurirSetting = (kurirName, field, value) => {
                setKurirSettings(prev => ({
                    ...prev,
                    [kurirName]: {
                        ...(prev[kurirName] || { gajiHarian: 150000, tglMasuk: '', tglAkhir: '', hariLibur: 0 }),
                        [field]: value
                    }
                }));
            };

            const toggleOlshop = (name) => setExpandedOlshops(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const toggleKurir = (name) => setExpandedKurirs(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            const openCairkanModal = (olshop) => { setSelectedOlshopToCairkan(olshop); setIsCairkanModalOpen(true); };

            const getFinancials = (pkg) => {
                if(!pkg) return { hBarang:0, tagihan:0, oDasar:0, oTambahan:0, oTotal:0 };
                const hBarang = Number(pkg.hargaPaket) || 0;
                const tagihan = Number(pkg.totalTagihan) || 0;
                const selisihTagihan = tagihan - hBarang > 0 ? tagihan - hBarang : 0;
                
                let oTambahan = Number(pkg.tambahanOngkir) || 0;
                let oDasar = Number(pkg.ongkirDasar) || 0;
                
                if (oTambahan === 0 && oDasar > 0 && selisihTagihan > oDasar) oTambahan = selisihTagihan - oDasar;
                else if (oTambahan === 0 && oDasar === 0 && selisihTagihan > 0) oDasar = selisihTagihan;
                if (oDasar === 0 && oTambahan > 0 && selisihTagihan > oTambahan) oDasar = selisihTagihan - oTambahan;

                return { hBarang, tagihan, oDasar, oTambahan, oTotal: oDasar + oTambahan };
            };

            const getFotoUrl = (pkg) => {
                if(!pkg) return null;
                const fileKey = pkg.fotoBukti || pkg.foto_bukti || pkg.foto || pkg.bukti || pkg.gambar;
                if (!fileKey || String(fileKey).trim() === '') return null;
                if (String(fileKey).startsWith('http://') || String(fileKey).startsWith('https://')) return fileKey;
                return `https://www.appsheet.com/template/gettablefileurl?appName=${APPSHEET_APP_ID}&tableName=InputPaket&fileName=${encodeURIComponent(fileKey)}`;
            };

            const syncData = async (isLoginAttempt = false) => {
                setIsLoadingSync(true);
                if(!isLoginAttempt) setSyncMessage({ text: '', type: '' });
                
                try {
                    const response = await fetch(`${SCRIPT_URL}?action=getInitData&t=${new Date().getTime()}`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        setPackages(result.data.packages || []);
                        setMasterOlshops(result.data.olshop || []);
                        setMasterZonas(result.data.zona || []);
                        setMasterKurirs(result.data.kurir || []);

                        if(!isLoginAttempt) {
                            setSyncMessage({ text: 'Data berhasil diperbarui!', type: 'success' });
                            setTimeout(() => setSyncMessage({ text: '', type: '' }), 3000);
                        }
                        return true;
                    } else {
                        setSyncMessage({ text: 'Gagal memuat data dari server.', type: 'error' });
                        return false;
                    }
                } catch (error) {
                    setSyncMessage({ text: 'Koneksi terputus. Cek internet Anda.', type: 'error' });
                    return false;
                } finally {
                    setIsLoadingSync(false);
                }
            };

            useEffect(() => {
                if (isMasterLoggedIn) { syncData(); }
            }, [isMasterLoggedIn]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setSyncMessage({ text: 'Memeriksa kredensial...', type: 'info' });
                const validUser1 = loginUname === 'ellyasma991' && loginPass === '082213663662';
                const validUser2 = loginUname === 'idypandu' && loginPass === '082257849332';
                if (validUser1 || validUser2) {
                    setIsMasterLoggedIn(true);
                    setLoginUname(''); setLoginPass('');
                    syncData(true);
                } else {
                    setSyncMessage({ text: 'Username atau Password Salah.', type: 'error' });
                }
            };

            const handleLogout = () => { setIsMasterLoggedIn(false); setPackages([]); };

            const handleProsesCairkan = async () => {
                if (!selectedOlshopToCairkan || selectedOlshopToCairkan.paketBelumCairIds.length === 0) return;
                setIsProcessingCair(true);
                setSyncMessage({ text: `Memproses pencairan ${selectedOlshopToCairkan.name}...`, type: 'info' });
                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'cairkanPaket');
                    formData.append('packageIds', JSON.stringify(selectedOlshopToCairkan.paketBelumCairIds));
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setSyncMessage({ text: `Berhasil mencairkan ${result.updated} paket untuk ${selectedOlshopToCairkan.name}!`, type: 'success' });
                        setIsCairkanModalOpen(false);
                        syncData(); 
                    } else setSyncMessage({ text: 'Gagal memproses: ' + result.message, type: 'error' });
                } catch (error) { setSyncMessage({ text: 'Terjadi kesalahan jaringan.', type: 'error' }); } 
                finally { setIsProcessingCair(false); }
            };

            const openEditModal = (pkg) => {
                if(!pkg) return;
                let tgl = pkg.dateString || pkg.tanggalInput || '';
                if (tgl && tgl.includes('T')) tgl = tgl.split('T')[0];
                else if (tgl) {
                    try { const d = new Date(tgl); if (!isNaN(d.getTime())) tgl = d.toISOString().split('T')[0]; } 
                    catch(e) {}
                }

                setEditModal({
                    isOpen: true,
                    packageId: pkg.packageId || '',
                    olshopName: pkg.olshopName || '',
                    status: String(pkg.status || '').toUpperCase(),
                    metodeBayar: pkg.metodeBayar || '',
                    hargaPaket: pkg.hargaPaket || 0,
                    ongkirKode: pkg.ongkirKode || '',
                    ongkirDasar: pkg.ongkirDasar || 0,
                    tambahanOngkir: pkg.tambahanOngkir || 0,
                    kurirId: pkg.kurirEmailAsli || pkg.kurirId || '',
                    tanggal: tgl
                });
                setIsEditModalOpen(true);
            };

            const handleOngkirKodeChange = (val) => {
                const zona = masterZonas.find(z => z.id === val || z.nama === val);
                const harga = zona ? zona.harga : 0;
                setEditModal(prev => ({ ...prev, ongkirKode: val, ongkirDasar: harga }));
            };

            const handleEditSubmit = async (e) => {
                e.preventDefault();
                setIsProcessingEdit(true);
                setSyncMessage({ text: `Menyimpan perubahan resi ${editModal.packageId}...`, type: 'info' });

                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'editPackageMaster'); 
                    formData.append('packageId', editModal.packageId);
                    formData.append('olshopName', editModal.olshopName);
                    formData.append('status', editModal.status);
                    formData.append('metodeBayar', editModal.metodeBayar); 
                    formData.append('hargaPaket', editModal.hargaPaket);
                    formData.append('ongkirKode', editModal.ongkirKode); 
                    formData.append('tambahanOngkir', editModal.tambahanOngkir);
                    formData.append('kurirId', editModal.kurirId); 
                    formData.append('tanggal', editModal.tanggal);

                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();

                    if (result.status === 'success') {
                        setSyncMessage({ text: 'Perubahan berhasil disimpan!', type: 'success' });
                        setIsEditModalOpen(false);
                        syncData(); 
                    } else setSyncMessage({ text: 'Gagal mengedit: ' + result.message, type: 'error' });
                } catch (error) { setSyncMessage({ text: 'Terjadi kesalahan jaringan.', type: 'error' }); } 
                finally { setIsProcessingEdit(false); }
            };

            const { filteredPkgs, olshopReport, kurirReport, globalSummary } = useMemo(() => {
                let pkgs = packages || [];
                
                // 1. Filter Search (Text)
                if (searchQuery) {
                    const q = searchQuery.toLowerCase().trim();
                    pkgs = pkgs.filter(p => String(p.customerName || '').toLowerCase().includes(q) || String(p.packageId || '').toLowerCase().includes(q) || String(p.olshopName || '').toLowerCase().includes(q) || String(p.kurirId || '').toLowerCase().includes(q));
                }
                
                // 2. Filter Tanggal (Date)
                if (startDate || endDate) {
                   pkgs = pkgs.filter(p => {
                      let pDateStr = p.dateString || p.tanggal || '';
                      if (!pDateStr) return false;
                      let normalizedDateStr = "";
                      try {
                          let d = new Date(pDateStr);
                          if (isNaN(d.getTime()) && pDateStr.includes('/')) {
                              const parts = pDateStr.split('/');
                              if (parts.length === 3) d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); 
                          }
                          if (!isNaN(d.getTime())) {
                              const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
                              normalizedDateStr = `${year}-${month}-${day}`;
                          } else { normalizedDateStr = pDateStr.split('T')[0]; }
                      } catch(e) { normalizedDateStr = pDateStr.split('T')[0]; }
                      
                      const sDate = startDate ? startDate : "2000-01-01";
                      const eDate = endDate ? endDate : "2100-01-01";
                      return normalizedDateStr >= sDate && normalizedDateStr <= eDate;
                   });
                }
                
                // 3. Hitung Summary Berdasarkan Rentang Tanggal (Sebelum Filter Status)
                let totalPkt = 0, totalSks = 0, totalPrs = 0, totalPnd = 0, totalCnc = 0;
                pkgs.forEach(p => {
                    if(!p) return;
                    totalPkt++;
                    let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                    if (stat === 'sukses') totalSks++;
                    else if (stat === 'cancel' || stat === 'batal') totalCnc++;
                    else if (stat === 'pending') totalPnd++;
                    else totalPrs++;
                });

                // 4. Filter Berdasarkan Tab Status (Untuk Laporan di Bawah)
                if (globalStatusFilter !== 'semua') {
                    pkgs = pkgs.filter(p => {
                        let stat = String(p.status || '').toLowerCase().trim().replace(' ', '_');
                        if (globalStatusFilter === 'proses') return stat === 'siap_antar' || stat === 'proses';
                        if (globalStatusFilter === 'cancel') return stat === 'cancel' || stat === 'batal';
                        return stat === globalStatusFilter;
                    });
                }

                const oReport = {}; const kReport = {};
                const summary = { 
                    totalPencairanOlshop: 0, totalDanaBelumCair: 0, totalDanaCair: 0, 
                    totalSetoranKurir: 0, totalPaketSukses: 0, totalOngkirTambahanKurir: 0, 
                    totalProfitPerusahaan: 0,
                    totalPkt, totalSks, totalPrs, totalPnd, totalCnc
                };

                // 5. Build Reports berdasarkan paket yang ter-filter
                pkgs.forEach(pkg => {
                    if(!pkg) return;
                    const statusPkg = String(pkg.status || '').toLowerCase().trim().replace(' ', '_');
                    const olshopName = String(pkg.olshopName || 'Tanpa Nama').toUpperCase();
                    const kurirName = String(pkg.kurirId || 'Tanpa Kurir').split('@')[0].toUpperCase();
                    const metode = String(pkg.metodeBayar || '').trim().toUpperCase();
                    const { hBarang, oDasar, oTambahan, oTotal } = getFinancials(pkg);

                    if (!oReport[olshopName]) oReport[olshopName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, pencairan: 0, potongan: 0, potonganDasar: 0, potonganTambahan: 0, totalDasar: 0, totalTambahan: 0, nilaiBarang: 0, nominalBelumCair: 0, paketBelumCairIds: [], paketBelumCairDetails: [], paketTerkait: [] };
                    if (!kReport[kurirName]) kReport[kurirName] = { totalSukses: 0, totalProses: 0, totalPending: 0, totalCancel: 0, setoran: 0, rincianCash: 0, rincianMinusTf: 0, totalTfOlshop: 0, totalTfKantor: 0, totalTambahanOngkir: 0, tambahanOngkirCash: 0, tambahanOngkirTF: 0, paketTerkait: [], totalDasarOngkir: 0, profitPerusahaan: 0 };
                    
                    oReport[olshopName].paketTerkait.push(pkg);
                    kReport[kurirName].paketTerkait.push(pkg);

                    if (statusPkg === 'sukses') {
                        oReport[olshopName].totalSukses += 1;
                        kReport[kurirName].totalSukses += 1;
                        summary.totalPaketSukses += 1;
                        summary.totalOngkirTambahanKurir += oTambahan; 
                        summary.totalProfitPerusahaan += oDasar; 
                        
                        oReport[olshopName].totalDasar += oDasar;
                        oReport[olshopName].totalTambahan += oTambahan;
                        
                        kReport[kurirName].totalTambahanOngkir += oTambahan;
                        kReport[kurirName].totalDasarOngkir += oDasar;
                        kReport[kurirName].profitPerusahaan += oDasar; 

                        const isCair = String(pkg.statusPencairan || '').toLowerCase() === 'cair';

                        let pencairan = 0; let potongan = 0;
                        if (metode === 'TF OLSHOP') { potongan = oTotal; oReport[olshopName].potonganDasar += oDasar; oReport[olshopName].potonganTambahan += oTambahan; pencairan = -oTotal; } 
                        else if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') { pencairan = hBarang; }

                        oReport[olshopName].pencairan += pencairan;
                        if (metode === 'TF OLSHOP') oReport[olshopName].potongan += oTotal;
                        if (metode === 'CASH' || metode === 'TF KANTOR' || metode === 'COD') oReport[olshopName].nilaiBarang += hBarang;
                        summary.totalPencairanOlshop += pencairan;

                        if (!isCair) {
                            oReport[olshopName].nominalBelumCair += pencairan;
                            oReport[olshopName].paketBelumCairIds.push(pkg.packageId); 
                            oReport[olshopName].paketBelumCairDetails.push(pkg);
                            summary.totalDanaBelumCair += pencairan;
                        } else { summary.totalDanaCair += pencairan; }

                        let setoranKurir = 0;
                        if (metode === 'TF OLSHOP' || metode === 'TF KANTOR') {
                            if (metode === 'TF OLSHOP') kReport[kurirName].totalTfOlshop += hBarang;
                            if (metode === 'TF KANTOR') kReport[kurirName].totalTfKantor += hBarang;
                            kReport[kurirName].rincianMinusTf += oTotal;
                            kReport[kurirName].tambahanOngkirTF += oTambahan; 
                            setoranKurir = -oTambahan; 
                        } else if (metode === 'CASH' || metode === 'COD') {
                            const cashDiterima = hBarang + oDasar + oTambahan; 
                            kReport[kurirName].rincianCash += cashDiterima;
                            kReport[kurirName].tambahanOngkirCash += oTambahan; 
                            setoranKurir = hBarang + oDasar; 
                        }
                        kReport[kurirName].setoran += setoranKurir;
                        summary.totalSetoranKurir += setoranKurir;

                    } else if (statusPkg === 'cancel' || statusPkg === 'batal') { oReport[olshopName].totalCancel += 1; kReport[kurirName].totalCancel += 1; } 
                    else if (statusPkg === 'pending') { oReport[olshopName].totalPending += 1; kReport[kurirName].totalPending += 1; } 
                    else { oReport[olshopName].totalProses += 1; kReport[kurirName].totalProses += 1; }
                });

                const activeOReport = Object.keys(oReport).filter(k => oReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = oReport[key]; return obj; }, {});
                const activeKReport = Object.keys(kReport).filter(k => kReport[k].paketTerkait.length > 0).reduce((obj, key) => { obj[key] = kReport[key]; return obj; }, {});

                const sortedOlshop = Object.keys(activeOReport).map(k => ({ name: k, ...activeOReport[k] })).sort((a, b) => b.pencairan - a.pencairan);
                const sortedKurir = Object.keys(activeKReport).map(k => ({ name: k, ...activeKReport[k] })).sort((a, b) => b.setoran - a.setoran);

                return { filteredPkgs: pkgs, olshopReport: sortedOlshop, kurirReport: sortedKurir, globalSummary: summary };

                                            <span className="text-[10px] text-orange-500/70 font-bold mb-1.5">Paket</span>
                                        </div>
                                    </div>
                                    <div className="glass-panel p-5 rounded-2xl shadow-sm col-span-1 flex flex-col justify-center relative border-purple-500/20">

                                            </div>

                                    <div className="p-4 md:p-5 border-b border-white/5 bg-slate-900/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                        <div>
                                            <h3 className="font-bold text-white text-sm md:text-base flex items-center">
                                                <div className="w-8 h-8 rounded-lg bg-yellow-500/20 flex items-center justify-center text-yellow-400 mr-3 border border-yellow-500/30"><i className="fas fa-calculator"></i></div> 
                                                Pengaturan Biaya Operasional
                                            </h3>
                                            <p className="text-[11px] text-slate-400 mt-1">Beban operasional akan dibagi <b className="text-slate-200">merata</b> ke {jumlahKurirAktif} kurir aktif.</p>
                                        </div>
                                        <div className="text-right bg-slate-900 p-3 rounded-xl border border-white/5 shadow-inner">
                                            <span className="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider block mb-1">Total Ops</span>
                                            <span className="text-yellow-400 font-black text-base md:text-xl">{formatCurrency(totalBiayaOperasional)}</span>
                                        </div>
                                    </div>
                                    <div className="p-5 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 bg-black/20">

                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1 tracking-wider"><i className="fas fa-wifi mr-1.5 text-blue-400/70"></i> Internet</label><input type="number" min="0" value={opsCosts.biayaWifi} onChange={(e) => handleOpsChange('biayaWifi', e.target.value)} className="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50 shadow-inner" /></div>

                                        <div className="flex flex-col"><label className="text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1 tracking-wider"><i className="fas fa-user-tie mr-1.5 text-purple-400/70"></i> Gaji Admin</label><input type="number" min="0" value={opsCosts.gajiAdmin} onChange={(e) => handleOpsChange('gajiAdmin', e.target.value)} className="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white font-bold outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500/50 shadow-inner" /></div>

                                    </div>

                                    <div className="overflow-x-auto custom-scrollbar">

                                                <div className="p-10 text-center text-slate-500 flex flex-col items-center"><i className="fas fa-box-open text-4xl mb-3 opacity-50"></i> Tidak ada data kurir.</div>

                                                !isAndroid ? (
                                                    <div className="grid grid-cols-[220px_1fr_1fr_140px_140px_130px_130px] gap-4 px-5 py-4 text-[10px] text-slate-400 font-extrabold uppercase tracking-widest bg-slate-900/80 border-b border-white/10 items-center">
                                                        <div>NAMA KURIR</div>
                                                        <div>RINCIAN TARGET BEBAN</div>
                                                        <div>PENCAPAIAN PROGRESS</div>
                                                        <div className="text-right">SISA TARGET</div>
                                                        <div className="text-right">RATA-RATA KURIR</div>
                                                        <div className="text-right text-yellow-400">SISA PAKET (EST)</div>
                                                        <div className="text-center">STATUS</div>
                                                    </div>
                                                ) : (
                                                    <div className="px-5 py-4 text-[11px] text-slate-300 font-extrabold uppercase tracking-widest bg-slate-900/80 border-b border-white/10 flex items-center">
                                                        <i className="fas fa-list-ul mr-2 text-emerald-500"></i> LIST TARGET KURIR
                                                    </div>
                                                )
                                            )}
                                            
                                            {[...kurirReport].map((kur, idx) => {
                                                const ks = kurirSettings[kur.name] || { gajiHarian: 150000, tglMasuk: '', tglAkhir: '', hariLibur: 0 };
                                                const hKerjaKotor = (ks.tglMasuk && ks.tglAkhir) ? Math.max(0, Math.ceil((new Date(ks.tglAkhir) - new Date(ks.tglMasuk)) / (1000 * 60 * 60 * 24)) + 1) : 0;
                                                const hKerjaBersih = Math.max(0, hKerjaKotor - (Number(ks.hariLibur) || 0));
                                                const targetGajiFinal = hKerjaBersih * (Number(ks.gajiHarian) || 0);
                                                
                                                const targetFinal = targetGajiFinal + bebanOpsPerKurir;
                                                const pencapaian = kur.profitPerusahaan; 
                                                const isTercapai = pencapaian >= targetFinal;
                                                const sisaTarget = isTercapai ? 0 : targetFinal - pencapaian;
                                                
                                                const avgOngkir = kur.totalSukses > 0 ? pencapaian / kur.totalSukses : 0;
                                                const estimasiPaket = (avgOngkir > 0 && sisaTarget > 0) ? Math.ceil(sisaTarget / avgOngkir) : 0;
                                                const progressPct = targetFinal > 0 ? Math.min((pencapaian / targetFinal) * 100, 100).toFixed(1) : 0;

                                                if (isAndroid) {
                                                    return (
                                                        <div key={idx} className="flex flex-col gap-4 px-5 py-5 border-b border-white/5 bg-slate-800/20">
                                                            <div className="flex justify-between items-center border-b border-white/5 pb-3">
                                                                <span className="font-bold text-white uppercase text-sm flex items-center"><i className="fas fa-motorcycle mr-2 text-blue-400 bg-blue-500/10 p-1.5 rounded-md"></i> {kur.name}</span>
                                                                <span className="text-[10px] text-emerald-400 font-bold bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">{kur.totalSukses} Pkt Selesai</span>
                                                            </div>
                                                            <div className="flex flex-col gap-2 bg-slate-900/80 p-4 rounded-xl border border-white/5 shadow-inner">
                                                                <div className="flex justify-between items-center text-[11px]">
                                                                    <span className="text-slate-400 font-medium">Gaji Harian:</span>
                                                                    <input type="number" value={ks.gajiHarian} onChange={(e) => updateKurirSetting(kur.name, 'gajiHarian', e.target.value)} className="w-24 bg-slate-800 border border-white/10 rounded-lg px-2 py-1.5 text-right text-white font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[11px]">
                                                                    <span className="text-slate-400 font-medium">Tgl Masuk:</span>
                                                                    <input type="date" value={ks.tglMasuk} onChange={(e) => updateKurirSetting(kur.name, 'tglMasuk', e.target.value)} className="bg-slate-800 border border-white/10 rounded-lg px-2 py-1.5 text-white outline-none w-[120px] focus:border-blue-500" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[11px]">
                                                                    <span className="text-slate-400 font-medium">Tgl Akhir:</span>
                                                                    <input type="date" value={ks.tglAkhir} onChange={(e) => updateKurirSetting(kur.name, 'tglAkhir', e.target.value)} className="bg-slate-800 border border-white/10 rounded-lg px-2 py-1.5 text-white outline-none w-[120px] focus:border-blue-500" />
                                                                </div>
                                                                <div className="flex justify-between items-center text-[11px]">
                                                                    <span className="text-slate-400 font-medium">Izin/Libur:</span>
                                                                    <div className="flex items-center">
                                                                        <input type="number" value={ks.hariLibur || ''} onChange={(e) => updateKurirSetting(kur.name, 'hariLibur', e.target.value)} className="bg-slate-800 border border-white/10 rounded-lg px-2 py-1.5 text-white outline-none w-[50px] text-right focus:border-yellow-500" placeholder="0" />
                                                                        <span className="text-[10px] text-slate-500 ml-2">Hari</span>
                                                                    </div>
                                                                </div>
                                                                <div className="flex justify-between items-center text-[11px] pt-2 mt-1 border-t border-white/5">
                                                                    <span className="text-slate-300 font-bold">Total Target (Gaji+Ops):</span>
                                                                    <span className="text-white font-black text-sm">{formatCurrency(targetFinal)}</span>
                                                                </div>
                                                            </div>
                                                            <div className="flex flex-col mt-1">
                                                                <div className="flex justify-between items-end mb-2">
                                                                    <span className="text-sm font-black text-emerald-400">{formatCurrency(pencapaian)}</span>
                                                                    <span className="text-[11px] font-black text-white bg-slate-800 px-2 py-0.5 rounded-md border border-white/10">{progressPct}%</span>
                                                                </div>
                                                                <div className="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-white/5 shadow-inner">
                                                                    <div className={`h-full rounded-full transition-all duration-1000 progress-bar-striped ${isTercapai ? 'bg-gradient-to-r from-emerald-500 to-green-400 shadow-glow-emerald' : 'bg-gradient-to-r from-yellow-500 to-orange-400'}`} style={{ width: `${progressPct}%` }}></div>
                                                                </div>
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-3 mt-2">
                                                                <div className="bg-slate-900/50 p-3 rounded-xl flex flex-col justify-center items-center border border-white/5 shadow-sm">
                                                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Sisa Target</span>
                                                                    <span className={`font-black text-sm ${isTercapai ? 'text-slate-500' : 'text-red-400'}`}>{isTercapai ? '0' : `-${formatCurrency(sisaTarget)}`}</span>
                                                                </div>
                                                                <div className="bg-slate-900/50 p-3 rounded-xl flex flex-col justify-center items-center border border-white/5 shadow-sm">
                                                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Estimasi Pkt</span>
                                                                    <span className={`font-black text-sm ${isTercapai ? 'text-slate-500' : 'text-yellow-400'}`}>{isTercapai ? '-' : `${estimasiPaket} Pkt`}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                }

                                                return (
                                                    <div key={idx} className="grid grid-cols-[220px_1fr_1fr_140px_140px_130px_130px] gap-4 px-5 py-5 border-b border-white/5 hover:bg-white/5 transition-colors items-center">
                                                        <div className="flex flex-col">
                                                            <span className="font-bold text-white uppercase truncate text-sm flex items-center" title={kur.name}><i className="fas fa-motorcycle mr-2 text-blue-400 opacity-70"></i>{kur.name}</span>
                                                            <span className="text-[11px] text-emerald-400 font-medium mt-1 inline-block bg-emerald-500/10 px-2 py-0.5 rounded w-max border border-emerald-500/20">{kur.totalSukses} Pkt Selesai</span>
                                                        </div>
                                                        <div className="flex flex-col gap-1.5 pr-4 border-r border-white/5">
                                                            <div className="flex justify-between items-center text-[10px] mb-1"><span className="text-slate-400 font-medium">Gaji Harian</span><input type="number" value={ks.gajiHarian} onChange={(e) => updateKurirSetting(kur.name, 'gajiHarian', e.target.value)} className="w-20 md:w-24 bg-slate-900 border border-white/10 rounded-md px-2 py-1 text-right text-white font-bold outline-none focus:border-blue-500 transition-colors" /></div>
                                                            <div className="flex flex-col gap-1 text-[10px] mb-1 bg-slate-900/50 p-2 rounded-lg border border-white/5">
                                                                <div className="flex justify-between items-center"><span className="text-slate-400">Tgl Masuk</span><input type="date" value={ks.tglMasuk} onChange={(e) => updateKurirSetting(kur.name, 'tglMasuk', e.target.value)} className="bg-slate-800 border border-white/10 rounded px-1.5 py-0.5 text-white outline-none w-[95px] focus:border-blue-500" /></div>
                                                                <div className="flex justify-between items-center"><span className="text-slate-400">Tgl Akhir</span><input type="date" value={ks.tglAkhir} onChange={(e) => updateKurirSetting(kur.name, 'tglAkhir', e.target.value)} className="bg-slate-800 border border-white/10 rounded px-1.5 py-0.5 text-white outline-none w-[95px] focus:border-blue-500" /></div>
                                                                <div className="flex justify-between items-center mt-1 pt-1 border-t border-white/5"><span className="text-slate-400">Izin/Libur</span><div className="flex items-center"><input type="number" value={ks.hariLibur || ''} onChange={(e) => updateKurirSetting(kur.name, 'hariLibur', e.target.value)} className="bg-slate-800 border border-white/10 rounded px-1.5 py-0.5 text-white outline-none w-[50px] text-right focus:border-yellow-500" placeholder="0" /><span className="text-[9px] text-slate-500 ml-1.5 w-[25px]">Hari</span></div></div>
                                                            </div>
                                                            <div className="flex justify-between items-center text-[10px] bg-slate-900/80 px-2 py-1.5 rounded-lg mb-1 border border-white/5 shadow-inner"><span className="text-slate-400">Kerja: <b className="text-white bg-slate-800 px-1.5 py-0.5 rounded">{hKerjaBersih} Hr</b></span><span className="text-emerald-400 font-black">{formatCurrency(targetGajiFinal)}</span></div>
                                                            <div className="flex justify-between items-center text-[10px] px-1"><span className="text-slate-400">Beban Ops Global</span><span className="text-orange-400 font-bold">+{formatCurrency(bebanOpsPerKurir)}</span></div>
                                                            <div className="flex justify-between items-center text-[11px] mt-1 pt-2 border-t border-white/10"><span className="text-slate-300 font-extrabold uppercase tracking-wider">Total Target</span><span className="text-white font-black bg-slate-800 px-2 py-0.5 rounded border border-white/10">{formatCurrency(targetFinal)}</span></div>
                                                        </div>
                                                        <div className="flex flex-col pr-5">
                                                            <div className="flex justify-between items-end mb-2"><span className="text-sm font-black text-emerald-400 drop-shadow-md">{formatCurrency(pencapaian)}</span><span className="text-[10px] font-black text-white bg-slate-800 px-1.5 py-0.5 rounded">{progressPct}%</span></div>
                                                            <div className="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-white/5 shadow-inner"><div className={`h-full rounded-full transition-all duration-1000 progress-bar-striped ${isTercapai ? 'bg-gradient-to-r from-emerald-500 to-green-400 shadow-glow-emerald' : 'bg-gradient-to-r from-yellow-500 to-orange-400'}`} style={{ width: `${progressPct}%` }}></div></div>
                                                        </div>
                                                        <div className="text-right flex flex-col justify-center"><span className={`font-black text-sm md:text-base ${isTercapai ? 'text-slate-600' : 'text-red-400'}`}>{isTercapai ? '0' : `-${formatCurrency(sisaTarget)}`}</span></div>
                                                        <div className="text-right font-bold text-slate-300 flex items-center justify-end bg-slate-900/50 py-1.5 px-2 rounded-lg border border-white/5">{formatCurrency(avgOngkir)}</div>
                                                        <div className="text-right flex items-center justify-end gap-1.5"><span className={`text-xl font-black ${isTercapai ? 'text-slate-600' : 'text-yellow-400 drop-shadow-md'}`}>{isTercapai ? '-' : `${estimasiPaket}`}</span>{!isTercapai && <span className="text-[10px] text-slate-500 font-bold uppercase">Pkt</span>}</div>
                                                        <div className="text-center">
                                                            {isTercapai ? (
                                                                <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-2 rounded-xl text-[10px] font-extrabold uppercase tracking-widest shadow-glow-emerald flex items-center justify-center"><i className="fas fa-star mr-1.5 text-yellow-400"></i> Lulus</span>
                                                            ) : (
                                                                <span className="bg-slate-900 text-slate-400 border border-white/10 px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-inner flex items-center justify-center"><i className="fas fa-spinner fa-spin mr-1.5 text-yellow-500"></i> Proses</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                                                                                    <td className="py-3 px-4 text-right whitespace-nowrap">
                                                                                                        <div className={`font-bold ${isSukses ? 'text-red-400' : 'text-slate-300'}`} title="Ongkir Dasar">{formatCurrency(oDasar)}</div>

                                                                                                    <td className="py-3 px-4 text-center align-middle">
                                                                                                        <div className="flex flex-col items-center justify-center gap-2">
                                                                                                            {pkg.fotoBukti ? (
                                                                                                                <div 
                                                                                                                    className="w-14 h-14 md:w-16 md:h-16 mx-auto rounded-lg bg-slate-800 border border-white/10 overflow-hidden cursor-pointer hover:opacity-80 transition-all transform hover:scale-105 shadow-md" 
                                                                                                                    onClick={(e) => { e.stopPropagation(); setSelectedImage(getFotoUrl(pkg)); }}
                                                                                                                    title="Klik untuk perbesar"
                                                                                                                >
                                                                                                                    <img src={getFotoUrl(pkg)} className="w-full h-full object-cover" alt="Bukti" loading="lazy" />
                                                                                                                </div>
                                                                                                            ) : (
                                                                                                                <div className="w-14 h-14 md:w-16 md:h-16 mx-auto rounded-lg bg-slate-800/50 border border-white/10 border-dashed flex flex-col items-center justify-center text-slate-500" title="Tidak Ada Foto">
                                                                                                                    <i className="fas fa-image text-sm mb-1 opacity-50"></i>
                                                                                                                    <span className="text-[8px] font-bold uppercase tracking-wider">NO FOTO</span>
                                                                                                                </div>
                                                                                                            )}

                                                                                                                <i className="fas fa-edit text-[10px] mr-1.5 text-blue-400 group-hover:text-white"></i> <span className="text-[10px] font-bold">Edit</span>
                                                                                                            </button>
                                                                                                        </div>
                                                                                                    </td>
                                                                                                </tr>
                                                                                            );
                                                                                        })}
                                                                                    </tbody>
                                                                                </table>
                                                                            </div>
                                                                        )
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}

                                                    <div className="flex items-center gap-4">
                                                        <div className="w-12 h-12 rounded-xl bg-blue-500/20 border border-blue-400/30 flex items-center justify-center text-blue-400 shadow-glow-blue backdrop-blur-sm">

                                                        </div>

                                                            <span className="text-[10px] font-extrabold text-slate-400 uppercase mb-1 tracking-widest"><i className="fas fa-boxes text-slate-500 mr-1.5"></i> Total Pkt Sukses</span>
                                                            <span className="text-xl md:text-2xl font-black text-white">{globalSummary.totalPaketSukses} <span className="text-[11px] text-slate-500 font-normal">Pkt</span></span>
                                                        </div>

                                                            <div className="absolute -right-2 -top-2 w-16 h-16 bg-emerald-400/20 rounded-full blur-xl pointer-events-none"></div>
                                                            <span className="text-[10px] font-extrabold text-emerald-400 uppercase mb-1 tracking-widest relative z-10"><i className="fas fa-money-bill-wave text-emerald-500 mr-1.5"></i> Wajib Setor Total</span>
                                                            <span className="text-xl md:text-3xl font-black text-emerald-400 drop-shadow-md relative z-10">{formatCurrency(globalSummary.totalSetoranKurir)}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                    </div>

                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-500/10 blur-[100px] rounded-full pointer-events-none"></div>
                        <div className="absolute top-1/4 right-1/4 w-[300px] h-[300px] bg-blue-500/10 blur-[80px] rounded-full pointer-events-none"></div>
                        
                        <div className="glass-panel p-8 md:p-10 rounded-[2rem] shadow-2xl w-full max-w-sm text-center relative z-10 border border-white/10 mt-4 backdrop-blur-xl">

                                <i className="fas fa-crown text-5xl relative z-10 filter drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]"></i>

                            <p className="text-sm text-slate-400 mb-8 font-medium tracking-wide uppercase mt-1">Exceed Express Analytics</p>
                            
                            <form onSubmit={handleLogin} className="space-y-5">
                                {syncMessage.text && (
                                    <div className={`text-xs py-3.5 px-4 rounded-xl font-bold flex items-start text-left shadow-inner ${syncMessage.type === 'error' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}`}>
                                        <i className={`fas ${syncMessage.type === 'error' ? 'fa-exclamation-circle' : 'fa-spinner fa-spin'} mr-2.5 mt-0.5 text-sm`}></i>
                                        <span className="leading-relaxed">{syncMessage.text}</span>
                                    </div>
                                )}
                                <div className="relative group">
                                    <div className="absolute left-4 top-1/2 transform -translate-y-1/2 w-8 h-8 rounded-lg bg-slate-800/80 flex items-center justify-center border border-white/5 group-focus-within:border-emerald-500/50 group-focus-within:bg-emerald-500/10 transition-colors">
                                        <i className="fas fa-user text-slate-400 group-focus-within:text-emerald-400 transition-colors text-xs"></i>
                                    </div>
                                    <input type="text" required value={loginUname} onChange={(e) => setLoginUname(e.target.value)} placeholder="Username ID" className="w-full pl-14 pr-4 py-4 bg-slate-900/60 border border-white/10 rounded-2xl text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white transition-all font-semibold placeholder-slate-500 shadow-inner" disabled={isLoadingSync} />
                                </div>
                                <div className="relative group">
                                    <div className="absolute left-4 top-1/2 transform -translate-y-1/2 w-8 h-8 rounded-lg bg-slate-800/80 flex items-center justify-center border border-white/5 group-focus-within:border-emerald-500/50 group-focus-within:bg-emerald-500/10 transition-colors">
                                        <i className="fas fa-lock text-slate-400 group-focus-within:text-emerald-400 transition-colors text-xs"></i>
                                    </div>
                                    <input type="password" required value={loginPass} onChange={(e) => setLoginPass(e.target.value)} placeholder="Password (Nomor HP)" className="w-full pl-14 pr-4 py-4 bg-slate-900/60 border border-white/10 rounded-2xl text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white transition-all font-semibold placeholder-slate-500 shadow-inner" disabled={isLoadingSync} />
                                </div>
                                <button type="submit" disabled={isLoadingSync} className={`w-full text-white font-bold py-4 rounded-2xl transition-all transform active:scale-95 flex justify-center items-center mt-2 text-sm tracking-wide ${isLoadingSync ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-white/5' : 'bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-[0_10px_20px_rgba(16,185,129,0.2)] border border-emerald-400/30'}`}>
                                    {isLoadingSync ? <><i className="fas fa-sync-alt animate-spin mr-3"></i> Memproses...</> : 'Masuk Dashboard'}
                                </button>
                            </form>
                        </div>
                    </div>
                );

                    <div className="absolute bottom-[-10%] left-[-5%] w-[30vw] h-[30vw] max-w-[400px] max-h-[400px] bg-blue-500/5 blur-[100px] rounded-full pointer-events-none"></div>
                    
                    {renderDashboardHeader()}

                    <div className="flex flex-1 overflow-hidden relative z-10">
                        {!isAndroid && (
                            <div className="hidden lg:flex">
                                {renderWebSidebar()}
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col p-4 md:p-5 w-full h-full relative scroll-smooth">
                            <div className={`mx-auto w-full space-y-4 md:space-y-6 pb-24 ${isAndroid ? 'max-w-xl' : 'max-w-7xl'}`}>

                                    <div className="lg:hidden flex overflow-x-auto space-x-3 border-b border-white/5 pb-3 mb-2 scrollbar-hide snap-x">
                                        <button onClick={() => setActiveTab('olshop')} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap snap-start transition-all shadow-sm border ${activeTab === 'olshop' ? 'bg-gradient-to-r from-orange-500 to-red-500 text-white border-transparent' : 'glass-panel text-slate-400 hover:text-white'}`}>Rekap Olshop</button>

                                        <button onClick={() => setActiveTab('gaji')} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap snap-start transition-all shadow-sm border ${activeTab === 'gaji' ? 'bg-gradient-to-r from-yellow-500 to-orange-500 text-white border-transparent' : 'glass-panel text-slate-400 hover:text-white'}`}>Gaji Ops</button>
                                    </div>
                                )}

                                {renderFilterSection()}
                                {renderStatusSummaryBar()}
                                {renderMetricCards()}
                                {isAndroid && renderMenuGrid()}
                                {renderContent()}

                        </div>

                                <div className="p-5 md:p-6 border-b border-white/5 bg-slate-900/50 flex justify-between items-center">
                                    <h3 className="font-bold text-white text-lg flex items-center"><div className="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 mr-3 border border-emerald-500/30"><i className="fas fa-hand-holding-usd"></i></div> Konfirmasi Pencairan</h3>
                                    <button onClick={() => setIsCairkanModalOpen(false)} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-red-500/20 hover:border-red-500/30 border border-white/5 transition-all flex items-center justify-center"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="p-5 md:p-6">
                                    <p className="text-slate-400 text-sm mb-5 font-medium">Anda akan memproses pencairan dana untuk Olshop berikut:</p>

                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-slate-500 text-xs font-extrabold uppercase tracking-wider">Nama Olshop</span>
                                            <span className="text-white font-bold text-sm bg-slate-800 px-3 py-1 rounded-lg border border-white/5">{selectedOlshopToCairkan.name}</span>
                                        </div>
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-slate-500 text-xs font-extrabold uppercase tracking-wider">Jumlah Paket</span>
                                            <span className="text-white font-bold bg-slate-800 px-3 py-1 rounded-lg border border-white/5 text-xs">{selectedOlshopToCairkan.paketBelumCairIds.length} Pkt</span>
                                        </div>
                                        <div className="flex justify-between items-center border-t border-white/5 pt-4 mt-4">
                                            <span className="text-emerald-500 text-xs font-extrabold uppercase tracking-wider">Total Dana Cair</span>
                                            <span className="text-emerald-400 font-black text-xl drop-shadow-md">{formatCurrency(selectedOlshopToCairkan.nominalBelumCair)}</span>
                                        </div>
                                    </div>

                                    <div className="flex gap-4">
                                        <button onClick={() => setIsCairkanModalOpen(false)} disabled={isProcessingCair} className="flex-1 py-3.5 rounded-xl font-bold text-slate-300 bg-slate-800 border border-white/5 hover:bg-slate-700 transition-colors">Batal</button>
                                        <button onClick={handleProsesCairkan} disabled={isProcessingCair} className="flex-1 py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 transition-all flex justify-center items-center shadow-[0_10px_20px_rgba(16,185,129,0.2)] border border-emerald-400/30">
                                            {isProcessingCair ? <><i className="fas fa-spinner fa-spin mr-2"></i> Memproses...</> : 'Cairkan Sekarang'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isEditModalOpen && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fade-in">

                                    <h3 className="font-bold text-white flex items-center text-lg"><div className="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 mr-3 border border-blue-500/30"><i className="fas fa-edit"></i></div> Edit Data Paket</h3>
                                    <button onClick={() => setIsEditModalOpen(false)} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-red-500/20 hover:border-red-500/30 border border-white/5 transition-all flex items-center justify-center"><i className="fas fa-times"></i></button>
                                </div>
                                
                                <form onSubmit={handleEditSubmit} className="p-5 space-y-5 overflow-y-auto custom-scrollbar flex-1 relative">

                                    <div className="bg-slate-950/50 p-4 rounded-2xl border border-white/5 text-center mb-2 shadow-inner relative overflow-hidden">

                                                <option value="">-- Pilih Olshop --</option>
                                                {!masterOlshops.some(o => o.nama === editModal.olshopName) && editModal.olshopName && (<option value={editModal.olshopName}>{editModal.olshopName}</option>)}

                                            </select>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-extrabold uppercase mb-2 ml-1 tracking-wider">Email / ID Kurir</label>
                                            <select value={editModal.kurirId} onChange={(e) => setEditModal({...editModal, kurirId: e.target.value})} className="bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 cursor-pointer shadow-inner appearance-none">
                                                <option value="">-- Pilih Kurir --</option>
                                                {!masterKurirs.some(k => k.id === editModal.kurirId) && editModal.kurirId && (<option value={editModal.kurirId}>{editModal.kurirId}</option>)}
                                                {masterKurirs.map((k, i) => <option key={i} value={k.id}>{k.nama}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-extrabold uppercase mb-2 ml-1 tracking-wider">Status Pengiriman</label>
                                            <select value={editModal.status} onChange={(e) => setEditModal({...editModal, status: e.target.value})} className="bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 cursor-pointer shadow-inner appearance-none">
                                                <option value="SUKSES">Sukses</option>
                                                <option value="SIAP_ANTAR">Proses (Siap Antar)</option>
                                                <option value="PENDING">Pending</option>
                                                <option value="CANCEL">Cancel / Batal</option>
                                            </select>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-extrabold uppercase mb-2 ml-1 tracking-wider">Metode Bayar</label>
                                            <select value={editModal.metodeBayar} onChange={(e) => setEditModal({...editModal, metodeBayar: e.target.value})} className="bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 cursor-pointer shadow-inner appearance-none">
                                                <option value="">-- KOSONG / BLM ADA --</option>
                                                <option value="CASH">CASH</option>
                                                <option value="TF OLSHOP">TF OLSHOP</option>
                                                <option value="TF KANTOR">TF KANTOR</option>
                                                <option value="COD">COD</option>
                                            </select>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-extrabold uppercase mb-2 ml-1 tracking-wider">Harga Barang</label>
                                            <div className="relative group">
                                                <span className="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-500 font-bold group-focus-within:text-blue-400 transition-colors">Rp</span>
                                                <input type="number" value={editModal.hargaPaket} onChange={(e) => setEditModal({...editModal, hargaPaket: e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm text-white font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 shadow-inner" />
                                            </div>
                                        </div>
                                        <div className="flex flex-col">

                                            <select value={editModal.ongkirKode} onChange={(e) => handleOngkirKodeChange(e.target.value)} className="bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 cursor-pointer shadow-inner appearance-none">
                                                <option value="">-- Pilih TRF / ZONA --</option>
                                                {!masterZonas.some(z => z.id === editModal.ongkirKode) && editModal.ongkirKode && (<option value={editModal.ongkirKode}>{editModal.ongkirKode}</option>)}
