                                            {editModal.ongkirDasar > 0 && <span className="text-[10px] text-emerald-400 mt-1.5 ml-1 font-bold"><i className="fas fa-check-circle mr-1"></i> Terbaca: Rp {formatCurrency(editModal.ongkirDasar)}</span>}
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-extrabold uppercase mb-2 ml-1 tracking-wider">Tambahan Ongkir (Vol)</label>
                                            <div className="relative group">
                                                <span className="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-500 font-bold group-focus-within:text-blue-400 transition-colors">Rp</span>
                                                <input type="number" value={editModal.tambahanOngkir} onChange={(e) => setEditModal({...editModal, tambahanOngkir: e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm text-white font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 shadow-inner" />
                                            </div>
                                        </div>
                                        <div className="flex flex-col">
                                            <label className="text-[10px] text-slate-400 font-extrabold uppercase mb-2 ml-1 tracking-wider">Ubah Tanggal</label>
                                            <input type="date" value={editModal.tanggal} onChange={(e) => setEditModal({...editModal, tanggal: e.target.value})} className="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 shadow-inner" />
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border border-blue-500/30 p-5 rounded-2xl mt-4 text-center shrink-0 shadow-inner relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-20 h-20 bg-blue-500/10 rounded-full blur-xl pointer-events-none"></div>
                                        <span className="text-[10px] text-blue-300 font-extrabold uppercase tracking-widest mb-1.5 block relative z-10">Estimasi Tagihan Resi</span>
                                        <h3 className="text-3xl font-black text-white drop-shadow-md relative z-10">{formatCurrency(Number(editModal.hargaPaket) + Number(editModal.ongkirDasar) + Number(editModal.tambahanOngkir))}</h3>
                                    </div>

                                    <div className="flex gap-4 pt-5 border-t border-white/5 shrink-0 relative z-10">
                                        <button type="button" onClick={() => setIsEditModalOpen(false)} disabled={isProcessingEdit} className="flex-1 py-3.5 rounded-xl font-bold text-slate-300 bg-slate-800 border border-white/5 hover:bg-slate-700 transition-colors">Batal</button>
                                        <button type="submit" disabled={isProcessingEdit} className="flex-1 py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 transition-all flex justify-center items-center shadow-[0_10px_20px_rgba(59,130,246,0.2)] border border-blue-400/30">
                                            {isProcessingEdit ? <><i className="fas fa-spinner fa-spin mr-2"></i> Menyimpan...</> : <><i className="fas fa-save mr-2"></i> Simpan Edit</>}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL FOTO MEMBESAR */}
                    {selectedImage && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950/90 backdrop-blur-xl p-4 transition-opacity" onClick={() => setSelectedImage(null)}>
                            <div className="relative w-full max-w-lg md:max-w-3xl flex flex-col items-center transform transition-all scale-100 animate-fade-in" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setSelectedImage(null)} className="absolute -top-14 right-0 md:-right-14 text-slate-400 bg-slate-900 hover:bg-red-500 hover:text-white w-12 h-12 rounded-full flex items-center justify-center transition-all shadow-[0_5px_15px_rgba(0,0,0,0.5)] border border-white/10 z-50">
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                                <div className="p-2 bg-slate-900 rounded-2xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] w-full">
                                    <img src={selectedImage} alt="Foto Paket" className="w-full max-h-[75vh] object-contain rounded-xl bg-slate-950" />
                                </div>
                                <p className="text-white font-black mt-5 tracking-widest text-sm uppercase flex items-center bg-slate-900/80 px-6 py-3 rounded-full border border-white/10 shadow-lg backdrop-blur-sm">
                                    <i className="fas fa-camera mr-3 text-blue-400"></i> FOTO BUKTI PENGIRIMAN
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const App = () => (
            <ErrorBoundary>
                <DashboardApp />
            </ErrorBoundary>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
